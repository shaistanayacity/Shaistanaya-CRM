<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  try {
    var savedTheme = localStorage.getItem("shaistanaya_theme");
    if (savedTheme === "light" || savedTheme === "dark") document.documentElement.setAttribute("data-theme", savedTheme);
  } catch (e) { /* storage unavailable: follow system theme */ }
</script>
<title>Shaistanaya CRM</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1F2F5;
    --panel: #FFFFFF;
    --panel-sunken: #F6F7F9;
    --line: #ECEDF1;
    --line-strong: #E1E3E9;
    --ink: #14161A;
    --muted: #767B85;
    --accent: #F0653A;
    --accent-ink: #FFFFFF;
    --accent-soft: #FDE7DF;
    --success: #1F8A4C;
    --success-soft: #E3F6E9;
    --warning: #B4740A;
    --warning-soft: #FCF0D8;
    --danger: #D1445B;
    --danger-soft: #FCE4E9;
    color-scheme: light;
    --radius: 16px;
    --radius-md: 10px;
    --radius-pill: 999px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101114;
      --panel: #18191D;
      --panel-sunken: #1E2025;
      --line: #2B2D33;
      --line-strong: #383A41;
      --ink: #EDEEF0;
      --muted: #9599A2;
      --accent: #FF7A52;
      --accent-ink: #17110C;
      --accent-soft: #3A2419;
      --success: #4ADE80;
      --success-soft: #163923;
      --warning: #F2B84B;
      --warning-soft: #3A2C11;
      --danger: #F27087;
      --danger-soft: #3A1B22;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101114;
    --panel: #18191D;
    --panel-sunken: #1E2025;
    --line: #2B2D33;
    --line-strong: #383A41;
    --ink: #EDEEF0;
    --muted: #9599A2;
    --accent: #FF7A52;
    --accent-ink: #17110C;
    --accent-soft: #3A2419;
    --success: #4ADE80;
    --success-soft: #163923;
    --warning: #F2B84B;
    --warning-soft: #3A2C11;
    --danger: #F27087;
    --danger-soft: #3A1B22;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: var(--safe-t); }
  html, body {
    background: var(--bg);
    color: var(--ink);
  }
  body {
    margin: 0;
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-top: var(--safe-t);
    padding-bottom: calc(var(--safe-b) + 16px);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  .display { font-weight: 700; letter-spacing: -0.02em; }
  #app {
    max-width: 920px;
    margin: 0 auto;
    animation: appear .4s ease both;
  }
  @keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #app { animation: none; } }

  .sidebar {
    position: sticky;
    top: var(--safe-t);
    z-index: 20;
    background: var(--panel);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .content { padding: 16px 16px 40px; }

  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo {
    flex: none;
    height: 40px; width: auto;
    display: block;
  }
  .brand-text h1 {
    font-size: 1.1rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
    line-height: 1.15;
  }
  .brand-text .sub {
    color: var(--muted);
    font-size: 0.74rem;
    margin-top: 1px;
  }
  .menu-label { display: none; }
  .sidebar-foot { display: none; }

  nav.tabs {
    display: flex;
    gap: 2px;
    margin-top: 12px;
    background: var(--panel-sunken);
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    padding: 3px;
    width: fit-content;
  }
  nav.tabs button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.83rem;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  nav.tabs button svg { flex: none; opacity: 0.8; }
  nav.tabs button.active {
    background: var(--panel);
    color: var(--ink);
    box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(20,20,20,0.06);
    font-weight: 600;
  }
  nav.tabs button.active svg { opacity: 1; color: var(--accent); }
  nav.tabs button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  @media (min-width: 960px) {
    #app {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      max-width: 1200px;
      align-items: start;
    }
    .sidebar {
      position: sticky;
      top: var(--safe-t);
      height: calc(100vh - var(--safe-t));
      background: var(--panel);
      border-bottom: none;
      border-right: 1px solid var(--line);
      padding: 26px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .brand-logo { height: 48px; }
    .brand-text h1 { font-size: 1.15rem; }
    .menu-label {
      display: block;
      margin: 26px 10px 8px;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .sidebar-foot {
      display: block;
      margin-top: auto;
      color: var(--muted);
      font-size: 0.72rem;
      background: var(--panel-sunken);
      border-radius: var(--radius-md);
      padding: 11px 12px;
    }
    nav.tabs {
      display: flex;
      flex-direction: column;
      background: transparent;
      border: none;
      padding: 0;
      margin-top: 0;
      gap: 2px;
      width: auto;
    }
    nav.tabs button {
      color: var(--muted);
      padding: 9px 10px;
      width: 100%;
      justify-content: flex-start;
      border-left: 3px solid transparent;
      border-radius: var(--radius-md);
      font-size: 0.87rem;
    }
    nav.tabs button.active {
      background: var(--accent-soft);
      color: var(--ink);
      box-shadow: none;
      border-left: 3px solid var(--accent);
    }
    nav.tabs button.active svg { color: var(--accent); }
    .content { padding: 30px 36px 60px; }
  }

  section.view { display: none; }
  section.view.active { display: block; }
  .app-loading {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 60px 10px;
    color: var(--muted);
    font-size: 0.9rem;
    justify-content: center;
  }
  .app-loading.show { display: flex; }
  .app-loading::before {
    content: "";
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 2px solid var(--line-strong);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .app-loading.error::before { display: none; }
  .app-loading.error { color: var(--danger); }
  @media (prefers-reduced-motion: reduce) { .app-loading::before { animation: none; } }

  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .page-title {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 3px;
  }
  .page-sub { color: var(--muted); font-size: 0.86rem; margin: 0; }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 16px 15px;
    box-shadow: 0 1px 2px rgba(20,20,20,0.03);
  }
  .stat-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .stat-icon {
    flex: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--panel-sunken);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
  }
  .stat .label {
    font-size: 0.76rem;
    color: var(--muted);
  }
  .stat .value {
    font-size: 1.65rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .stat .value small { font-size: 0.92rem; font-weight: 500; color: var(--muted); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 20px 22px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(20,20,20,0.03);
  }
  .panel h2 {
    font-size: 1.02rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 3px;
  }
  .panel .hint {
    color: var(--muted);
    font-size: 0.8rem;
    margin: 0 0 16px;
  }

  .bar-row { margin-bottom: 12px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-row .bar-top {
    display: flex;
    justify-content: space-between;
    font-size: 0.83rem;
    margin-bottom: 5px;
  }
  .bar-row .bar-top .name { font-weight: 500; }
  .bar-row .bar-top .pct { color: var(--muted); }
  .bar-track {
    height: 7px;
    background: var(--panel-sunken);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: var(--radius-pill);
    width: 0;
    transition: width 0.7s cubic-bezier(.2,.7,.3,1);
  }
  @media (prefers-reduced-motion: reduce) {
    .bar-fill { transition: none; }
  }

  .funnel { display: flex; flex-direction: column; gap: 0; }
  .funnel-step {
    display: grid;
    grid-template-columns: 20px 1fr auto auto;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.86rem;
  }
  .funnel-step:last-child { border-bottom: none; }
  .funnel-step .n { color: var(--muted); font-size: 0.78rem; }
  .funnel-step .count { font-weight: 700; min-width: 34px; text-align: right; }
  .funnel-step .rate { color: var(--muted); font-size: 0.78rem; min-width: 42px; text-align: right; }
  .funnel-note {
    margin-top: 10px;
    font-size: 0.78rem;
    color: var(--muted);
    border-top: 1px dashed var(--line);
    padding-top: 10px;
  }

  table.leads {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  table.leads th {
    text-align: left;
    font-weight: 600;
    color: var(--muted);
    font-size: 0.73rem;
    padding: 0 10px 10px 0;
    border-bottom: 1px solid var(--line-strong);
  }
  table.leads td {
    padding: 13px 10px 13px 0;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  table.leads tbody tr { cursor: pointer; }
  table.leads tbody tr:hover td { background: var(--panel-sunken); }
  .badge {
    display: inline-block;
    font-size: 0.71rem;
    font-weight: 600;
    letter-spacing: 0.005em;
    padding: 3px 9px;
    border-radius: var(--radius-pill);
    white-space: nowrap;
  }
  .badge.s-masuk { background: var(--panel-sunken); color: var(--muted); }
  .badge.s-direspon { background: var(--accent-soft); color: var(--accent); }
  .badge.s-followup { background: var(--warning-soft); color: var(--warning); }
  .badge.s-janjian { background: var(--warning-soft); color: var(--warning); }
  .badge.s-deal { background: var(--success-soft); color: var(--success); }
  .badge.s-lost { background: var(--danger-soft); color: var(--danger); }
  .sla-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; }
  .sla-good { background: var(--success); }
  .sla-mid { background: var(--warning); }
  .sla-bad { background: var(--danger); }
  .stale-cell { color: var(--danger); font-weight: 600; }

  .detail-row td { background: var(--panel-sunken); cursor: default; }
  .detail-row:hover td { background: var(--panel-sunken); }
  .detail {
    padding: 14px 4px 4px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .detail .field { font-size: 0.82rem; }
  .detail .field .k { color: var(--muted); font-size: 0.72rem; margin-bottom: 2px; }
  .detail .notes { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; }
  .detail .notes ul { list-style: none; margin: 0 0 8px; padding: 0; }
  .detail .notes li { font-size: 0.8rem; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .detail .notes li:last-child { border-bottom: none; }
  .detail .notes li .t { color: var(--muted); font-size: 0.7rem; margin-right: 6px; }
  .detail .note-add { display: flex; gap: 6px; grid-column: 1/-1; }
  .detail .stage-row { grid-column: 1/-1; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .detail .strategy-wrap { grid-column: 1/-1; }
  .strategy-box { background: var(--accent-soft); border-radius: var(--radius-md); padding: 12px 14px; }
  .strategy-head { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
  .strategy-goal { font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; line-height: 1.35; }
  .strategy-contact { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
  .strategy-contact.warn { color: var(--danger); font-weight: 600; }
  .strategy-actions { margin: 0 0 8px; padding-left: 17px; font-size: 0.82rem; }
  .strategy-actions li { margin-bottom: 4px; }
  .strategy-script { background: var(--panel); border-radius: var(--radius-md); padding: 8px 10px; font-size: 0.8rem; font-style: italic; margin-bottom: 8px; }
  .strategy-script .k { font-style: normal; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 3px; }
  .strategy-avoid { font-size: 0.78rem; color: var(--danger); }
  .strategy-cluster { background: var(--panel); border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 8px; }
  .strategy-cluster .k { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
  .cluster-note-text { font-size: 0.82rem; margin-bottom: 9px; line-height: 1.45; }
  .cluster-note-text p { margin: 0 0 6px; }
  .cluster-note-text ul, .cluster-note-text ol { margin: 2px 0 8px; padding-left: 18px; }
  .cluster-note-text ol { padding-left: 24px; }
  .cluster-note-text li strong { font-weight: 600; }
  .cluster-note-text .note-label.block + ol, .cluster-note-text .note-label.block + ul { margin-top: 4px; }
  .usp-panel .strategy-cluster { background: var(--panel-sunken); }
  .usp-panel .cluster-note-text { font-size: 0.86rem; }
  .usp-panel .cluster-note-text .note-label.block { margin-top: 14px; color: var(--accent); font-size: 0.74rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .usp-panel .cluster-note-text .note-label.block:first-child { margin-top: 0; }
  .cluster-note-text li { margin-bottom: 3px; }
  .cluster-note-text .note-label { font-weight: 700; }
  .cluster-note-text .note-label.block { display: block; margin-top: 2px; }
  .cluster-note-edit { display: flex; flex-direction: column; gap: 8px; }
  .cluster-note-edit textarea { min-height: 190px; font-size: 0.84rem; line-height: 1.45; }
  .cluster-note-edit .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .cluster-note-edit .tip { color: var(--muted); font-size: 0.72rem; margin-left: auto; }

  label { display: block; font-size: 0.78rem; color: var(--muted); margin: 0 0 4px; }
  label .opt { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: 0.75; }
  select, input[type=text], input[type=tel], input[type=date], input[type=datetime-local], textarea {
    width: 100%;
    font: inherit;
    font-size: 0.9rem;
    padding: 9px 11px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-md);
    background: var(--panel);
    color: var(--ink);
  }
  textarea { resize: vertical; min-height: 44px; }
  .field-wrap { margin-bottom: 14px; }
  .checkbox-label { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 0.86rem; cursor: pointer; }
  .checkbox-label input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  .filter-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; margin-bottom: 4px; }
  .range-bar { padding: 14px 20px 0; }
  .range-bar .filter-bar { max-width: 560px; }
  .filter-summary { display: flex; justify-content: space-between; align-items: center; margin: 2px 0 14px; flex-wrap: wrap; gap: 8px; }
  .chart-toggle {
    display: flex;
    gap: 2px;
    background: var(--panel-sunken);
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    padding: 2px;
  }
  .chart-toggle button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.76rem;
    font-weight: 500;
    padding: 4px 11px;
    border-radius: var(--radius-pill);
    cursor: pointer;
  }
  .chart-toggle button.active {
    background: var(--panel);
    color: var(--ink);
    box-shadow: 0 0 0 1px var(--line);
    font-weight: 600;
  }

  button.primary {
    appearance: none;
    border: none;
    background: var(--ink);
    color: var(--panel);
    font: inherit;
    font-size: 0.86rem;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: var(--radius-md);
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(20,20,20,0.14);
  }
  button.primary:active { transform: translateY(1px); }
  button.ghost {
    appearance: none;
    border: 1px solid var(--line-strong);
    background: var(--panel);
    color: var(--ink);
    font: inherit;
    font-size: 0.82rem;
    font-weight: 500;
    padding: 7px 13px;
    border-radius: var(--radius-md);
    cursor: pointer;
  }
  button.danger {
    appearance: none;
    border: 1px solid var(--danger);
    background: transparent;
    color: var(--danger);
    font: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: var(--radius-md);
    cursor: pointer;
  }
  button.danger:hover { background: var(--danger-soft); }
  .brand-tools { margin-left: auto; display: flex; gap: 6px; align-self: center; }
  .icon-btn {
    appearance: none;
    width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line-strong);
    background: var(--panel);
    color: var(--muted);
    border-radius: var(--radius-pill);
    cursor: pointer;
    padding: 0;
  }
  .icon-btn:hover { color: var(--ink); }
  .theme-row {
    appearance: none;
    display: flex; align-items: center; gap: 7px;
    width: 100%;
    margin-top: 8px;
    padding: 6px 0 0;
    border: none;
    border-top: 1px solid var(--line);
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 0.72rem;
    cursor: pointer;
    text-align: left;
  }
  .theme-row:hover { color: var(--ink); }
  .icon-btn[hidden] { display: none; }
  @media (min-width: 960px) { .icon-btn.mobile-only { display: none; } }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + var(--safe-b));
    transform: translate(-50%, 12px);
    background: var(--ink);
    color: var(--panel);
    font-size: 0.84rem;
    padding: 9px 16px;
    border-radius: var(--radius-md);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .empty {
    text-align: center;
    padding: 30px 10px;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .table-scroll { overflow-x: auto; }

  .login-overlay {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: var(--bg);
    display: none;

<script>
(function () {

  var STORAGE_KEY = "shaistanaya_lead_log_v1";

  var SOURCE_GROUPS = [
    { group: "Instagram", options: ["Instagram Organic", "Instagram Story", "Instagram DM", "Instagram Ads"] },
    { group: "Facebook", options: ["Facebook Organic", "Facebook Ads"] },
    { group: "Website", options: ["Website Form", "Website Live Chat"] },

  ];

  var STAGES = ["Masuk", "Direspon", "Follow Up", "Janjian", "Deal"];
  var STAGE_RANK = { "Masuk": 0, "Direspon": 1, "Follow Up": 2, "Janjian": 3, "Deal": 4 };
  var STAGE_CLASS = { "Masuk": "s-masuk", "Direspon": "s-direspon", "Follow Up": "s-followup", "Janjian": "s-janjian", "Deal": "s-deal", "Lost": "s-lost" };
  var STAGE_LABEL = { "Masuk": "Masuk", "Direspon": "Direspon", "Follow Up": "Follow Up", "Janjian": "Janjian (Survey)", "Deal": "Deal", "Lost": "Hilang" };

  var STRATEGY = {
    "Masuk": {
      goal: "Respon secepat mungkin — target di bawah 15 menit, sebelum lead dingin",
      actions: [

      ],

    "Deal": {

        "Kalau alasannya produk/lokasi tidak cocok, cukup arsipkan tanpa perlu dikejar"
      ],
      avoid: "",
      scripts: {}
    }
  };

  // Light formatting for cluster notes: line breaks, "- " / "• " bullets,
  // and a short "Label:" at the start of a line shown in bold.
  function formatNote(text) {
    var html = "", listOpen = null;
    function openList(tag) {
      if (listOpen === tag) return;
      closeList();
      html += "<" + tag + ">";
      listOpen = tag;
    }
    function closeList() { if (listOpen) { html += "</" + listOpen + ">"; listOpen = null; } }
    String(text).split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim();
      if (!line) { closeList(); return; }
      var bullet = line.match(/^[-•*]\s+(.*)$/);
      if (bullet) {
        openList("ul");
        html += "<li>" + escapeHtml(bullet[1]) + "</li>";
        return;
      }
      // "12. Point — explanation": keep the number, bold the point.
      var numbered = line.match(/^(\d{1,3})[.)]\s+(.*)$/);
      if (numbered) {
        openList("ol");
        var parts = numbered[2].split(" — ");
        var body = parts.length > 1
          ? "<strong>" + escapeHtml(parts[0]) + "</strong> — " + escapeHtml(parts.slice(1).join(" — "))
          : escapeHtml(numbered[2]);
        html += '<li value="' + numbered[1] + '">' + body + "</li>";
        return;
      }
      closeList();
      if (/:$/.test(line)) {
        html += '<span class="note-label block">' + escapeHtml(line) + "</span>";
        return;
      }
      var label = line.match(/^([^:]{1,24}):\s*(.*)$/);
      if (label && !/^https?$/i.test(label[1])) {
        html += label[2]
          ? '<p><span class="note-label">' + escapeHtml(label[1]) + ':</span> ' + escapeHtml(label[2]) + "</p>"
          : '<span class="note-label block">' + escapeHtml(label[1]) + ":</span>";
      } else {
        html += "<p>" + escapeHtml(line) + "</p>";
      }
    });
    closeList();
    return html;
  }

  function renderClusterFocus(minat, title) {
    if (!minat || minat === "—") return "";
    var note = clusterNotes[minat];
    var html = '<div class="strategy-cluster">';
    if (title !== "") html += '<div class="k">' + (title == null ? "Fokus jual — " + escapeHtml(minat) : escapeHtml(title)) + '</div>';
    if (editingCluster === minat) {
      html += '<div class="cluster-note-edit"><textarea placeholder="Target: …&#10;Direspon:&#10;- poin pertama&#10;- poin kedua" data-cluster-note-input="' + escapeHtml(minat) + '">' + escapeHtml(note || "") + '</textarea>';
      html += '<div class="actions"><button type="button" class="ghost" data-action="save-cluster-note" data-minat="' + escapeHtml(minat) + '">Simpan</button>';
      html += '<button type="button" class="ghost" data-action="cancel-cluster-note" data-minat="' + escapeHtml(minat) + '">Batal</button>';
      html += '<span class="tip">Enter = baris baru · awali "- " untuk bullet · "Judul:" di awal baris jadi tebal</span></div></div>';
    } else if (note) {
      html += '<div class="cluster-note-text">' + formatNote(note) + '</div>';
      html += '<button type="button" class="ghost" data-action="edit-cluster-note" data-minat="' + escapeHtml(minat) + '">Ubah catatan</button>';
    } else {
      html += '<div class="hint" style="margin:0 0 8px">Belum ada catatan strategi khusus untuk ' + escapeHtml(minat) + '. Tambahkan sekali, otomatis kepakai di semua lead yang minatnya sama.</div>';
      html += '<button type="button" class="ghost" data-action="edit-cluster-note" data-minat="' + escapeHtml(minat) + '">+ Tambah catatan</button>';
    }
    html += '</div>';
    return html;
  }

  function buildStrategyHtml(lead) {
    var s = STRATEGY[lead.stage];
    if (!s) return "";
    var group = sourceGroupOf(lead.source);
    var minatLabel = (lead.minat && lead.minat !== "—") ? lead.minat : "unit ini";
    var html = '<div class="strategy-box">';
    html += '<div class="strategy-head">Strategi untuk tahap ' + STAGE_LABEL[lead.stage] + '</div>';
    var fu = followUpCount(lead);
    var overdue = lead.stage === "Follow Up" && fu >= 3;
    html += '<div class="strategy-contact' + (overdue ? ' warn' : '') + '">' + (overdue ? '⚠️ ' : '') +
      'Kontak terakhir ' + contactLabel(lead) + ' · sudah ' + fu + ' kali dikontak' +
      (overdue ? ' — 3x+ follow up belum closing, pertimbangkan pindah ke nurture jangka panjang' : '') + '</div>';
    html += '<div class="strategy-goal">' + escapeHtml(s.goal) + '</div>';
    if (s.actions && s.actions.length) {
      html += '<ul class="strategy-actions">';
      s.actions.forEach(function (a) { html += '<li>' + escapeHtml(a) + '</li>'; });
      html += '</ul>';
    }
    html += renderClusterFocus(lead.minat);
    if (s.scripts && s.scripts[group]) {
      var scriptText = s.scripts[group].split("{{minat}}").join(minatLabel);
      html += '<div class="strategy-script"><div class="k">Contoh pembuka (' + escapeHtml(group) + ')</div>"' + escapeHtml(scriptText) + '"</div>';
    }
    if (s.avoid) {
      html += '<div class="strategy-avoid">Hindari: ' + escapeHtml(s.avoid) + '</div>';
    }
    html += '</div>';
    return html;
  }

  var DOMISILI = ["Sidoarjo", "Surabaya", "Gresik", "Krian", "Malang", "Mojokerto"];
  var MINAT_GROUPS = [
    { group: "Cluster Sierra", options: ["Bianca Garden", "Bianca Deluxe", "Arnica Garden", "Arnica Pool", "Bianca Deluxe Hook", "Arnica Garden Hook", "Arnica Pool Hook"] },
    { group: "Cluster Montana", options: ["Gwen", "New Gwen", "Darlene", "Gwen Hook", "New Gwen Hook", "Angeline Hook"] }
  ];
  var MINAT = MINAT_GROUPS[0].options.concat(MINAT_GROUPS[1].options);
  var NAMES = ["Dewi Anggraini", "Bayu Saputra", "Rina Kartika", "Fajar Nugroho", "Siti Aminah", "Hendra Wijaya",
    "Putri Lestari", "Agus Setiawan", "Maya Puspita", "Rizky Ramadhan", "Nur Halimah", "Dimas Prakoso",
    "Indah Permata", "Yoga Pratama", "Wulan Sari", "Andika Firmansyah", "Lestari Ningsih", "Eko Prasetyo",
    "Anisa Rahma", "Fajrul Falah", "Citra Ayu", "Teguh Santoso", "Diah Ratnasari", "Wahyu Hidayat"];
  var SAMPLE_NOTES = ["Tanya cicilan per bulan", "Minta brosur digital", "Follow up via WA, belum dibalas",
    "Sudah dikirim lokasi & harga", "Tertarik tapi masih bandingkan cluster lain", "Nanya jadwal survey lokasi",
    "Minta simulasi KPR", "Nanya DP minimal"];

  function uid() { return Math.random().toString(36).slice(2, 10); }

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
  function pickWeighted(rng, pairs) {
    var total = pairs.reduce(function (s, p) { return s + p[1]; }, 0);
    var r = rng() * total;
    for (var i = 0; i < pairs.length; i++) {
      r -= pairs[i][1];
      if (r <= 0) return pairs[i][0];
    }
    return pairs[pairs.length - 1][0];
  }

  function genPhone(rng) {
    var n = "08";
    for (var i = 0; i < 9; i++) n += Math.floor(rng() * 10);
    return n;
  }

  function seedData() {
    var rng = mulberry32(20260923);
    var leads = [];
    var sourceWeights = [
      ["Facebook Ads", 38], ["Facebook Organic", 8],
      ["Instagram Ads", 17], ["Instagram Organic", 6], ["Instagram Story", 3], ["Instagram DM", 3],
      ["WhatsApp Ads (Click to Chat)", 11], ["WhatsApp Business Chat", 8],
      ["Website Form", 4], ["Website Live Chat", 2]
    ];
    var now = new Date(2026, 8, 23, 17, 0, 0);
    var count = 58;
    for (var i = 0; i < count; i++) {
      var daysAgo = Math.floor(rng() * 23);
      var created = new Date(2026, 8, 23 - daysAgo, 8 + Math.floor(rng() * 11), Math.floor(rng() * 60));
      if (created > now) created = new Date(now.getTime() - 3600000);
      var source = pickWeighted(rng, sourceWeights);

      var stageRoll = rng();
      var stage, lost = false, lossRank = null;
      if (stageRoll < 0.14) { stage = "Masuk"; }
      else if (stageRoll < 0.42) { stage = "Direspon"; }
      else if (stageRoll < 0.62) { stage = "Follow Up"; }
      else if (stageRoll < 0.78) { stage = "Janjian"; }
      else if (stageRoll < 0.90) { stage = "Deal"; }
      else {
        stage = "Lost";
        lost = true;
        var priorRoll = rng();
        lossRank = priorRoll < 0.35 ? 0 : priorRoll < 0.65 ? 1 : priorRoll < 0.85 ? 2 : 3;
      }

      var respondedAt = null;
      var responseMinutes = null;
      var willRespond = stage !== "Masuk";
      if (willRespond) {
        responseMinutes = Math.floor(rng() * rng() * 180) + 3;
        respondedAt = new Date(created.getTime() + responseMinutes * 60000);
        if (respondedAt > now) { respondedAt = null; responseMinutes = null; }
      }

      var notes = [];
      if (stage !== "Masuk") {
        var noteCount = stage === "Masuk" ? 0 : (rng() < 0.6 ? 1 : 2);
        for (var n = 0; n < noteCount; n++) {
          var noteTime = new Date(created.getTime() + (n + 1) * (30 + rng() * 600) * 60000);
          if (noteTime > now) noteTime = now;
          notes.push({ ts: noteTime.toISOString(), text: pick(rng, SAMPLE_NOTES) });
        }
      }

      leads.push({
        id: uid(),
        createdAt: created.toISOString(),
        respondedAt: respondedAt ? respondedAt.toISOString() : null,
        source: source,
        nama: pick(rng, NAMES),
        telp: genPhone(rng),
        domisili: pick(rng, DOMISILI),
        minat: pick(rng, MINAT),
        stage: stage,
        lossRank: lossRank,
        notes: notes
      });
    }
    leads.sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
    return leads;
  }

  function loadStateLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* storage unavailable */ }
    return [];
  }

  function saveStateLocal(leadsArr) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(leadsArr)); }
    catch (e) { /* ignore — demo still works in-memory this session */ }
  }

  var db = null; // Supabase client once signed in; null = use localStorage fallback

  function leadToRow(l) {
    return {
      id: l.id,
      created_at: l.createdAt,
      responded_at: l.respondedAt,
      source: l.source,
      nama: l.nama,
      telp: l.telp,
      domisili: l.domisili,
      minat: l.minat,
      stage: l.stage,
      loss_rank: l.lossRank,
      notes: l.notes || []
    };
  }
  function rowToLead(r) {
    return {
      id: r.id,
      createdAt: r.created_at,
      respondedAt: r.responded_at,
      source: r.source,
      nama: r.nama,
      telp: r.telp,
      domisili: r.domisili,
      minat: r.minat,
      stage: r.stage,
      lossRank: r.loss_rank,
      notes: r.notes || []
    };
  }

  function reportDbError(error) {
    if (error) showToast("Gagal simpan ke server (" + (error.code || error.message || "error") + ")");
  }

  function persistLead(lead) {
    if (db) {
      db.from("leads").upsert(leadToRow(lead)).then(function (res) { reportDbError(res.error); });
    } else {
      saveStateLocal(leads);
    }
  }

  function deleteLead(lead) {
    var idx = leads.indexOf(lead);

  function aggregateTrend(src, start, end, mode) {
    var keyOf = mode === "monthly"
      ? function (d) { return dayKeyLocal(new Date(d.getFullYear(), d.getMonth(), 1)); }
      : mode === "weekly"
      ? function (d) { return dayKeyLocal(startOfWeek(d)); }
      : function (d) { return dayKeyLocal(d); };
    var map = {};
    src.forEach(function (l) { var k = keyOf(new Date(l.createdAt)); map[k] = (map[k] || 0) + 1; });
    var arr = [];
    var d = mode === "monthly" ? new Date(start.getFullYear(), start.getMonth(), 1)
      : mode === "weekly" ? startOfWeek(start) : new Date(start);
    d.setHours(0, 0, 0, 0);
    while (d <= end) {
      var label = mode === "monthly" ? pad2(d.getMonth() + 1) + "/" + String(d.getFullYear()).slice(2) : shortDateLabel(d);
      arr.push({ label: label, count: map[dayKeyLocal(d)] || 0 });
      if (mode === "monthly") d.setMonth(d.getMonth() + 1);
      else d.setDate(d.getDate() + (mode === "weekly" ? 7 : 1));

  function computeSourceConversion(src) {

      groups[g].total++;

    return Object.keys(groups).map(function (g) {

  function computeFieldBreakdown(src, field, cap) {

    var list = Object.keys(groups).map(function (v) {
      return { name: v, count: groups[v], pct: Math.round((groups[v] / total) * 100) };

  function renderTrendChart(data) {
    var w = 640, h = 170, padBottom = 22, padTop = 14;

    var gap = 6;

    var everyNth = Math.max(1, Math.ceil(data.length / 16));
    var bars = "", labels = "";
    data.forEach(function (p, i) {
      var barH = Math.round((p.count / max) * (h - padBottom - padTop));
      var x = i * (barW + gap);
      var y = h - padBottom - barH;
      bars += '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + barW.toFixed(1) + '" height="' + Math.max(barH, 1) + '" rx="1.5" fill="var(--accent)"></rect>';

  }

  function getFilteredLeads() {
    return leads.filter(function (l) {

          if (l.stage === "Deal" || l.stage === "Lost") return false;

      if (filters.dateFrom || filters.dateTo) {
        var leadDay = dayKeyLocal(new Date(l.createdAt));
        if (filters.dateFrom && leadDay < filters.dateFrom) return false;
        if (filters.dateTo && leadDay > filters.dateTo) return false;
      }
      if (filters.q) {
        var q = filters.q.toLowerCase();
        if (l.nama.toLowerCase().indexOf(q) === -1 && l.telp.indexOf(q) === -1) return false;
      }
      return true;

    if (preset === "custom" && (!dashRange.from || !dashRange.to)) preset = "month";
    if (preset === "today") { start = today; }
    else if (preset === "7" || preset === "30" || preset === "90") {
      start = new Date(today); start.setDate(start.getDate() - (+preset - 1));
    } else if (preset === "month") { start = new Date(today.getFullYear(), today.getMonth(), 1); }
    else if (preset === "lastmonth") {
      start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
      end = endOfDay(new Date(today.getFullYear(), today.getMonth(), 0));
    } else if (preset === "year") { start = new Date(today.getFullYear(), 0, 1); }
    else if (preset === "all") {
      start = leads.reduce(function (min, l) {
        var d = new Date(l.createdAt); return d < min ? d : min;
      }, today);
      start = new Date(start); start.setHours(0, 0, 0, 0);
    } else {
      start = parseDayKey(dashRange.from);
      end = endOfDay(parseDayKey(dashRange.to));
      if (start > end) { var t = start; start = new Date(end); start.setHours(0, 0, 0, 0); end = endOfDay(t); }
    }
    if (preset === "custom") label = fmtDayLong(start) + " – " + fmtDayLong(end);
    else label = DASH_PRESETS.filter(function (p) { return p[0] === preset; })[0][1] +
      (preset === "all" || preset === "today" ? "" : " (" + fmtDayLong(start) + " – " + fmtDayLong(end) + ")");
    return { start: start, end: end, label: label, all: preset === "all" };
  }

  function bindDashRangeBar() {
    document.getElementById("dash-preset").addEventListener("change", function (e) {

      }
      renderDashboard();
    });
    var fromEl = document.getElementById("dash-from");

    if (fromEl) fromEl.addEventListener("change", function (e) { if (e.target.value) { dashRange.from = e.target.value; renderDashboard(); } });
    if (toEl) toEl.addEventListener("change", function (e) { if (e.target.value) { dashRange.to = e.target.value; renderDashboard(); } });

  function renderDashboard() {
    var el = document.getElementById("view-dashboard");
    var range = resolveDashRange();
    var needsHistory = !historyLoaded && (range.all || range.start < recentCutoff());
    if (needsHistory) ensureHistoryLoaded();
    var dashLeads = leads.filter(function (l) {
      var d = new Date(l.createdAt);
      return d >= range.start && d <= range.end;
    });
    var total = dashLeads.length;
    var resp = computeResponseStats(dashLeads);
    var sources = computeSourceBreakdown(dashLeads);
    var funnel = computeFunnel(dashLeads);
    var lostCount = dashLeads.filter(function (l) { return l.stage === "Lost"; }).length;

    var maxSourceCount = sources.length ? sources[0].count : 1;

    var surveyCount = funnel.filter(function (f) { return f.stage === "Janjian"; })[0];
    surveyCount = surveyCount ? surveyCount.count : 0;

    var html = "";
    html += renderPageHeader("Dashboard", "Ringkasan performa lead &amp; funnel · " + escapeHtml(range.label) +
      (needsHistory ? " · memuat riwayat lama…" : ""), "ph-add-dash");
    html += renderDashRangeBar();
    html += '<div class="stat-row">';
    html += '<div class="stat"><div class="stat-top"><span class="stat-icon">' + ICONS.total + '</span><span class="label">Total lead</span></div><div class="value mono">' + total + '</div></div>';
    html += '<div class="stat"><div class="stat-top"><span class="stat-icon">' + ICONS.check + '</span><span class="label">Sudah direspon</span></div><div class="value mono">' + resp.rate + '<small>%</small></div></div>';
    html += '<div class="stat"><div class="stat-top"><span class="stat-icon">' + ICONS.survey + '</span><span class="label">Survey</span></div><div class="value mono">' + surveyCount + '</div></div>';
    html += '<div class="stat"><div class="stat-top"><span class="stat-icon">' + ICONS.clock + '</span><span class="label">Rata-rata waktu respon</span></div><div class="value mono">' + (resp.avgMinutes != null ? resp.avgMinutes : "—") + '<small> mnt</small></div></div>';
    html += '</div>';

    var rangeDays = Math.round((range.end - range.start) / 86400000);
    var effectiveTrendMode = rangeDays > 366 ? "monthly"
      : trendMode === "daily" && rangeDays > 62 ? "weekly" : trendMode;
    var trendData = aggregateTrend(dashLeads, range.start, range.end, effectiveTrendMode);
    html += '<div class="panel">';
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">';
    html += '<h2 style="margin:0">Tren Lead Masuk</h2>';
    html += '<div class="chart-toggle"><button type="button" data-mode="daily" class="' + (trendMode === "daily" ? "active" : "") + '">Harian</button><button type="button" data-mode="weekly" class="' + (trendMode === "weekly" ? "active" : "") + '">Mingguan</button></div>';
    html += '</div>';
    html += '<p class="hint">' + ({ daily: "Per hari", weekly: "Per minggu, dimulai tiap Senin", monthly: "Per bulan" })[effectiveTrendMode] +
      (effectiveTrendMode !== trendMode
        ? (effectiveTrendMode === "monthly" ? " — rentang lebih dari setahun otomatis ditampilkan per bulan" : " — rentang lebih dari 2 bulan otomatis ditampilkan per minggu")
        : "") + '</p>';
    html += '<div class="table-scroll">' + renderTrendChart(trendData) + '</div>';
    html += '</div>';

    html += '<div class="panel">';
    html += '<h2>Distribusi Sumber Lead</h2>';
    html += '<p class="hint">Persentase dari ' + total + ' lead di rentang ini</p>';
    sources.forEach(function (s) {
      var pctWidth = Math.max(4, Math.round((s.count / maxSourceCount) * 100));
      html += '<div class="bar-row">';
      html += '<div class="bar-top"><span class="name">' + escapeHtml(s.name) + '</span><span class="pct mono">' + s.pct + '% · ' + s.count + '</span></div>';
      html += '<div class="bar-track"><div class="bar-fill" data-w="' + pctWidth + '"></div></div>';
      html += '</div>';
    });
    html += '</div>';

    var conv = computeSourceConversion(dashLeads);
    html += '<div class="panel">';
    html += '<h2>Conversion Rate per Sumber</h2>';
    html += '<p class="hint">Berapa persen lead dari tiap sumber yang berakhir Deal — bukan cuma volume, tapi kualitasnya</p>';
    html += '<div class="table-scroll"><table class="leads"><thead><tr><th>Sumber</th><th>Total Lead</th><th>Deal</th><th>Conversion</th></tr></thead><tbody>';
    conv.forEach(function (c, i) {
      html += '<tr><td>' + escapeHtml(c.name) + (i === 0 && c.rate > 0 ? ' <span class="badge s-deal">Tertinggi</span>' : '') + '</td>';
      html += '<td class="mono">' + c.total + '</td><td class="mono">' + c.deal + '</td><td class="mono">' + c.rate + '%</td></tr>';
    });
    html += '</tbody></table></div>';
    html += '</div>';

    var minatBreakdown = computeFieldBreakdown(dashLeads, "minat", 6);
    var domisiliBreakdown = computeFieldBreakdown(dashLeads, "domisili", 6);
    var maxMinat = minatBreakdown.length ? Math.max.apply(null, minatBreakdown.map(function (x) { return x.count; })) : 1;
    var maxDomisili = domisiliBreakdown.length ? Math.max.apply(null, domisiliBreakdown.map(function (x) { return x.count; })) : 1;

    html += '<div class="panel">';
    html += '<h2>Unit / Cluster Paling Diminati</h2>';
    html += '<p class="hint">Dari kolom minat yang diisi saat input lead</p>';
    if (!minatBreakdown.length) {
      html += '<div class="empty">Belum ada data minat.</div>';
    } else {
      minatBreakdown.forEach(function (m) {
        var w = Math.max(4, Math.round((m.count / maxMinat) * 100));
        html += '<div class="bar-row"><div class="bar-top"><span class="name">' + escapeHtml(m.name) + '</span><span class="pct mono">' + m.pct + '% · ' + m.count + '</span></div>';
        html += '<div class="bar-track"><div class="bar-fill" data-w="' + w + '"></div></div></div>';
      });
    }
    html += '</div>';

    html += '<div class="panel">';
    html += '<h2>Sebaran Domisili Prospek</h2>';
    html += '<p class="hint">Dari kolom domisili yang diisi saat input lead</p>';
    if (!domisiliBreakdown.length) {
      html += '<div class="empty">Belum ada data domisili.</div>';
    } else {
      domisiliBreakdown.forEach(function (m) {
        var w2 = Math.max(4, Math.round((m.count / maxDomisili) * 100));
        html += '<div class="bar-row"><div class="bar-top"><span class="name">' + escapeHtml(m.name) + '</span><span class="pct mono">' + m.pct + '% · ' + m.count + '</span></div>';
        html += '<div class="bar-track"><div class="bar-fill" data-w="' + w2 + '"></div></div></div>';
      });
    }
    html += '</div>';

    html += '<div class="panel">';
    html += '<h2>Alur Lead</h2>';
    html += '<p class="hint">Berapa lead yang mencapai tiap tahap ini (kumulatif, termasuk yang sempat hilang di tahap berikutnya)</p>';
    html += '<div class="funnel">';
    funnel.forEach(function (f, i) {
      html += '<div class="funnel-step">';
      html += '<span class="n mono">' + (i + 1) + '</span>';
      html += '<span>' + STAGE_LABEL[f.stage] + '</span>';
      html += '<span class="count">' + f.count + '</span>';
      html += '<span class="rate">' + f.pct + '%</span>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="funnel-note">' + lostCount + ' lead ditandai hilang (di berbagai tahap) · target respon awal: 15 menit — bisa disesuaikan</div>';
    html += '</div>';

    html += '<div class="panel">';
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">';
    html += '<h2 style="margin:0">Lead Terbaru</h2>';
    html += '<button type="button" class="ghost" id="goto-all">Lihat &amp; filter semua lead →</button>';
    html += '</div>';
    html += '<p class="hint">Klik satu baris untuk lihat detail, ubah tahap, atau tambah catatan</p>';
    html += renderLeadsTable(leads.slice(0, 8));
    html += '</div>';

    el.innerHTML = html;

    requestAnimationFrame(function () {
      el.querySelectorAll(".bar-fill").forEach(function (bar) {
        bar.style.width = bar.getAttribute("data-w") + "%";
      });
    });

    var gotoBtn = document.getElementById("goto-all");
    if (gotoBtn) gotoBtn.addEventListener("click", function () { switchView("all"); });
    bindAddLeadShortcut("ph-add-dash");

    bindDashRangeBar();

    el.querySelectorAll(".chart-toggle button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        trendMode = btn.getAttribute("data-mode");
        renderDashboard();
      });
    });

    el.querySelectorAll("tr[data-id]").forEach(function (row) {
      row.addEventListener("click", function () { toggleExpand(row.getAttribute("data-id")); });
    });
    bindDetailHandlers(el);
  }

  function slaClass(lead) {
    if (!lead.respondedAt) return "sla-bad";
    var mins = (new Date(lead.respondedAt) - new Date(lead.createdAt)) / 60000;
    if (mins <= 15) return "sla-good";
    if (mins <= 60) return "sla-mid";
    return "sla-bad";
  }

  function renderLeadsTable(list) {

  function bindDetailHandlers(root) {
    root.querySelectorAll('select[data-action="stage"]').forEach(function (sel) {
      sel.addEventListener("click", function (e) { e.stopPropagation(); });
      sel.addEventListener("change", function (e) {
        e.stopPropagation();
        var id = sel.getAttribute("data-id");
        var lead = leads.find(function (x) { return x.id === id; });
        if (!lead) return;
        var newStage = sel.value;
        if (newStage === "Lost" && lead.stage !== "Lost") {
          lead.lossRank = STAGE_RANK[lead.stage];
        }
        if (newStage !== "Lost" && !lead.respondedAt && STAGE_RANK[newStage] >= 1) {
          lead.respondedAt = new Date().toISOString();
        }
        lead.stage = newStage;
        persistLead(lead);
        refreshAll();
        showToast("Tahap diperbarui");
      });
    });
    root.querySelectorAll('button[data-action="delete-lead"]').forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = btn.getAttribute("data-id");
        var lead = leads.find(function (x) { return x.id === id; });
        if (!lead) return;
        if (!window.confirm("Hapus lead " + lead.nama + " (" + lead.telp + ")?\n\nData dan semua catatannya akan hilang permanen.")) return;
        deleteLead(lead);
      });
    });
    root.querySelectorAll('button[data-action="addnote"]').forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = btn.getAttribute("data-id");
        var input = root.querySelector('input[data-note-input="' + id + '"]');
        var text = input.value.trim();
        if (!text) return;
        var lead = leads.find(function (x) { return x.id === id; });
        lead.notes.push({ ts: new Date().toISOString(), text: text });
        persistLead(lead);
        refreshAll();
        showToast("Catatan ditambahkan");
      });
    });
    root.querySelectorAll('button[data-action="edit-cluster-note"]').forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        editingCluster = btn.getAttribute("data-minat");
        refreshAll();
      });
    });
    root.querySelectorAll('button[data-action="save-cluster-note"]').forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var minat = btn.getAttribute("data-minat");
        var input = root.querySelector('[data-cluster-note-input="' + minat + '"]');
        var text = input.value.trim();
        if (text) clusterNotes[minat] = text; else delete clusterNotes[minat];
        persistClusterNote(minat, text);
        editingCluster = null;
        refreshAll();
        showToast("Catatan strategi disimpan");
      });
    });
    root.querySelectorAll('button[data-action="cancel-cluster-note"]').forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        editingCluster = null;
        refreshAll();
      });
    });
    root.querySelectorAll(".detail").forEach(function (d) {
      d.addEventListener("click", function (e) { e.stopPropagation(); });
    });
  }

      renderAllLeadsView();
    });

    document.getElementById("export-csv").addEventListener("click", async function () {
      if (!historyLoaded) {
        showToast("Memuat riwayat lama dulu…");
        if (!(await ensureHistoryLoaded())) return;
      }
      var list = getFilteredLeads();
      if (!list.length) { showToast("Tidak ada lead buat diexport"); return; }
      var csv = leadsToCsv(list);
      var rangeLabel = (filters.dateFrom || filters.dateTo)
        ? (filters.dateFrom || "awal") + "_sd_" + (filters.dateTo || "sekarang")
        : "semua";
      var filename = "backup-lead-shaistanaya-" + rangeLabel + ".csv";
      try {
        var blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        showToast("Backup tersimpan");
      } catch (e) {
        showToast("Export gagal, coba lagi");
      }
    });


    el.querySelectorAll("tr[data-id]").forEach(function (row) {
      row.addEventListener("click", function () { toggleExpand(row.getAttribute("data-id")); });
    });
    bindDetailHandlers(el);
  }

  // ---------- Input form ----------

  function renderInputForm() {
    var el = document.getElementById("view-input");
    var html = renderPageHeader("Input Lead", "Catat lead baru begitu masuk", null);
    html += '<div class="panel">';
    html += '<h2>Tambah Lead</h2>';
    html += '<p class="hint">No. telp, jam masuk &amp; jam respon wajib diisi — sisanya opsional</p>';
    html += '<form id="lead-form">';
    html += '<div class="form-grid">';

    html += '<div class="field-wrap full"><label for="f-source">Sumber lead <span class="opt">(opsional)</span></label><select id="f-source">';
    html += '<option value="" selected>Belum diketahui / pilih sumber…</option>';
    SOURCE_GROUPS.forEach(function (g) {
      html += '<optgroup label="' + g.group + '">';
      g.options.forEach(function (o) { html += '<option value="' + o + '">' + o + '</option>'; });
      html += '</optgroup>';
    });
    html += '</select></div>';

    html += '<div class="field-wrap"><label for="f-nama">Nama <span class="opt">(opsional)</span></label><input type="text" id="f-nama"></div>';
    html += '<div class="field-wrap"><label for="f-telp">No. telp</label><input type="tel" id="f-telp" required></div>';
    html += '<div class="field-wrap"><label for="f-created">Jam masuk</label><input type="datetime-local" id="f-created" value="' + nowDatetimeLocalValue() + '" required></div>';
    html += '<div class="field-wrap"><label for="f-responded">Jam respon</label><input type="datetime-local" id="f-responded" value="' + nowDatetimeLocalValue() + '" required></div>';
    html += '<div class="field-wrap"><label for="f-domisili">Domisili <span class="opt">(opsional)</span></label><input type="text" id="f-domisili"></div>';
    html += '<div class="field-wrap"><label for="f-minat">Minat / unit <span class="opt">(opsional)</span></label><select id="f-minat">';
    html += '<option value="" selected>Belum diketahui / pilih unit…</option>';
    MINAT_GROUPS.forEach(function (g) {
      html += '<optgroup label="' + g.group + '">';
      g.options.forEach(function (o) { html += '<option value="' + o + '">' + o + '</option>'; });
      html += '</optgroup>';
    });
    html += '</select></div>';
    html += '<div class="field-wrap full"><label for="f-catatan">Catatan awal <span class="opt">(opsional)</span></label><textarea id="f-catatan"></textarea></div>';

    html += '</div>';
    html += '<button type="submit" class="primary">Simpan Lead</button>';
    html += '</form>';
    html += '</div>';

    html += '<div class="panel">';
    html += '<h2>Masuk Hari Ini</h2>';
    var today = new Date();
    var todays = leads.filter(function (l) {
      var d = new Date(l.createdAt);
      return d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
    });
    html += renderLeadsTable(todays);
    html += '</div>';

    el.innerHTML = html;

    el.querySelectorAll("tr[data-id]").forEach(function (row) {
      row.addEventListener("click", function () { toggleExpand(row.getAttribute("data-id")); });
    });
    bindDetailHandlers(el);

    document.getElementById("lead-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var source = document.getElementById("f-source").value;
      var nama = document.getElementById("f-nama").value.trim();
      var telp = document.getElementById("f-telp").value.trim();
      var domisili = document.getElementById("f-domisili").value.trim();
      var minat = document.getElementById("f-minat").value.trim();
      var catatan = document.getElementById("f-catatan").value.trim();
      var createdRaw = document.getElementById("f-created").value;
      var respondedRaw = document.getElementById("f-responded").value;
      if (!telp || !createdRaw || !respondedRaw) return;

      var createdDate = createdRaw ? new Date(createdRaw) : new Date();
      if (isNaN(createdDate.getTime())) createdDate = new Date();
      var createdIso = createdDate.toISOString();

      var respondedIso = null;
      if (respondedRaw) {
        var respondedDate = new Date(respondedRaw);
        if (!isNaN(respondedDate.getTime())) respondedIso = respondedDate.toISOString();
      }

      var lead = {
        id: uid(),
        createdAt: createdIso,
        respondedAt: respondedIso,
        source: source || "—",
        nama: nama || "(tanpa nama)",
        telp: telp,
        domisili: domisili || "—",
        minat: minat || "—",
        stage: respondedIso ? "Direspon" : "Masuk",
        lossRank: null,
        notes: catatan ? [{ ts: new Date().toISOString(), text: catatan }] : []
      };
      leads.unshift(lead);
      persistLead(lead);
      showToast("Lead tersimpan");
      refreshAll();
    });
  }

  // ---------- Playbook ----------

  function renderPlaybook() {
    var el = document.getElementById("view-playbook");
    var counts = {};
    STAGES.concat(["Lost"]).forEach(function (s) { counts[s] = 0; });
    leads.forEach(function (l) { counts[l.stage] = (counts[l.stage] || 0) + 1; });

    var html = renderPageHeader("Playbook", "Pendekatan yang disarankan di tiap tahap — jadi CS tau strateginya, bukan cuma status leadnya", null);
    html += '<div class="panel usp-panel">';
    html += '<h2>' + escapeHtml(USP_KEY) + '</h2>';
    html += '<p class="hint">Keunggulan kawasan &amp; unit buat bahan jawaban ke calon pembeli — bisa diubah kalau ada info baru</p>';
    html += renderClusterFocus(USP_KEY, "");
    html += '</div>';
    STAGES.concat(["Lost"]).forEach(function (stage) {
      var s = STRATEGY[stage];
      html += '<div class="panel">';
      html += '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">';
      html += '<h2 style="margin:0">' + STAGE_LABEL[stage] + '</h2>';
      html += '<span class="badge ' + STAGE_CLASS[stage] + '">' + counts[stage] + ' lead saat ini</span>';
      html += '</div>';
      html += '<p class="hint" style="margin-top:6px">' + escapeHtml(s.goal) + '</p>';
      if (s.actions && s.actions.length) {
        html += '<ul class="strategy-actions" style="padding-left:19px;margin-bottom:' + (s.avoid || Object.keys(s.scripts).length ? "10px" : "0") + '">';
        s.actions.forEach(function (a) { html += '<li>' + escapeHtml(a) + '</li>'; });
        html += '</ul>';
      }
      if (s.scripts && Object.keys(s.scripts).length) {
        html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:' + (s.avoid ? "10px" : "0") + '">';
        Object.keys(s.scripts).forEach(function (g) {
          var scriptText = s.scripts[g].split("{{minat}}").join("(nama unit)");
          html += '<div class="strategy-script" style="margin-bottom:0"><div class="k">' + escapeHtml(g) + '</div>"' + escapeHtml(scriptText) + '"</div>';
        });
        html += '</div>';
      }
      if (s.avoid) html += '<div class="strategy-avoid">Hindari: ' + escapeHtml(s.avoid) + '</div>';
      html += '</div>';
    });

    MINAT_GROUPS.forEach(function (g) {
      html += '<div class="panel">';
      html += '<h2>Fokus Jual — ' + g.group + '</h2>';
      html += '<p class="hint">Catatan ini otomatis muncul di strategi tiap lead yang minatnya sama — isi sekali, kepakai terus</p>';
      g.options.forEach(function (m) { html += renderClusterFocus(m); });
      html += '</div>';
    });

    el.innerHTML = html;
    bindDetailHandlers(el);
  }

  // ---------- Nav ----------

  function switchView(view) {
    document.querySelectorAll("nav.tabs button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-view") === view);
    });
    document.querySelectorAll("section.view").forEach(function (s) { s.classList.remove("active"); });
    document.getElementById("view-" + view).classList.add("active");
  }

  document.querySelectorAll("nav.tabs button").forEach(function (btn) {
    btn.addEventListener("click", function () { switchView(btn.getAttribute("data-view")); });
  });

  function recentCutoff() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - RECENT_DAYS);
    return d;
  }

  // PostgREST caps each response (1000 rows by default), so read in pages.
  async function fetchAllLeads(applyFilter) {
    var PAGE = 1000, from = 0, out = [];
    for (;;) {
      var q = applyFilter(db.from("leads").select("*"))
        .order("created_at", { ascending: false })
        .order("id", { ascending: true })
        .range(from, from + PAGE - 1);
      var res = await q;
      if (res.error) throw res.error;
      out = out.concat(res.data.map(rowToLead));
      if (res.data.length < PAGE) return out;
      from += PAGE;
    }
  }

  var ACTIVE_STAGE_FILTER = 'stage.in.(Masuk,Direspon,"Follow Up",Janjian)';

  async function loadLeadsFromDb() {
    var cutoff = recentCutoff().toISOString();
    var list = await fetchAllLeads(function (q) {
      return q.or('created_at.gte."' + cutoff + '",' + ACTIVE_STAGE_FILTER);
    });
    historyLoaded = false;
    return list;
  }

  function ensureHistoryLoaded() {
    if (historyLoaded) return Promise.resolve(true);
    if (historyLoading) return historyLoading;
    var cutoff = recentCutoff().toISOString();
    historyLoading = fetchAllLeads(function (q) {
      return q.lt("created_at", cutoff).in("stage", ["Deal", "Lost"]);
    }).then(function (older) {
      var known = {};
      leads.forEach(function (l) { known[l.id] = true; });
      older.forEach(function (l) { if (!known[l.id]) leads.push(l); });
      leads.sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
      historyLoaded = true;
      refreshAll();
      showToast(older.length ? older.length + " lead lama dimuat" : "Tidak ada lead lama");
      return true;
    }).catch(function (e) {
      showToast("Gagal memuat riwayat (" + (e.code || e.message || "error") + ")");
      refreshAll();
      return false;
    }).then(function (ok) {
      historyLoading = null;
      return ok;
    });
    return historyLoading;
  }

  async function loadClusterNotesFromDb() {
    var res = await db.from("cluster_notes").select("minat, note");
    if (res.error) throw res.error;
    if (!res.data.length) {
      var seeded = {};
      var rows = Object.keys(CLUSTER_NOTES_SEED).map(function (k) {
        seeded[k] = CLUSTER_NOTES_SEED[k];
        return { minat: k, note: CLUSTER_NOTES_SEED[k] };
      });
      var ins = await db.from("cluster_notes").upsert(rows);
      if (ins.error) throw ins.error;
      return seeded;
    }
    var obj = {};
    res.data.forEach(function (r) { obj[r.minat] = r.note; });
    return obj;
  }

  function renderAll() {
    var loadingEl = document.getElementById("app-loading");
    if (loadingEl) loadingEl.classList.remove("show");
    refreshAll();
  }

  function startLocal() {
    db = null;
    historyLoaded = true;
    leads = loadStateLocal();
    clusterNotes = loadClusterNotesLocal();
    renderAll();
  }

  async function startWithSupabase(client, session) {
    document.getElementById("login-overlay").classList.remove("show");
    document.getElementById("account").hidden = false;
    document.getElementById("logout-btn-m").hidden = false;
    document.getElementById("account-email").textContent = session.user.email || "";
    try {
      db = client;
      leads = await loadLeadsFromDb();
      clusterNotes = await loadClusterNotesFromDb();
      renderAll();
    } catch (e) {
      db = null;
      var notMember = e && e.code === "42501";
      showToast(notMember ? "Akun belum terdaftar sebagai anggota tim" : "Gagal memuat data dari server (" + (e.code || e.message || "error") + ")");
      document.getElementById("app-loading").classList.add("error");
      document.getElementById("app-loading").textContent = notMember
        ? "Akun " + (session.user.email || "ini") + " belum terdaftar sebagai anggota tim. Minta admin menambahkan email ini ke daftar tim."
        : "Gagal memuat data. Muat ulang halaman untuk mencoba lagi.";
    }
  }

  function showLogin(client) {
    document.getElementById("login-overlay").classList.add("show");
    var form = document.getElementById("login-form");
    var errEl = document.getElementById("login-error");
    var submit = document.getElementById("login-submit");
    form.onsubmit = async function (e) {
      e.preventDefault();
      errEl.textContent = "";
      submit.disabled = true;
      var res = await client.auth.signInWithPassword({
        email: document.getElementById("login-email").value.trim(),
        password: document.getElementById("login-password").value
      });
      submit.disabled = false;
      if (res.error) { errEl.textContent = "Email atau password salah."; return; }
      startWithSupabase(client, res.data.session);
    };
  }

  // ---------- Theme ----------

  var THEME_KEY = "shaistanaya_theme";
  var THEME_ORDER = ["auto", "light", "dark"];
  var THEME_META = {
    auto: { label: "Tema: otomatis (ikut perangkat)", short: "Tema otomatis", icon: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor"/></svg>' },
    light: { label: "Tema: terang", short: "Tema terang", icon: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>' },
    dark: { label: "Tema: gelap", short: "Tema gelap", icon: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1z"/></svg>' }
  };
  function currentTheme() {
    var t = document.documentElement.getAttribute("data-theme");
    return t === "light" || t === "dark" ? t : "auto";
  }
  function renderThemeButton() {
    var meta = THEME_META[currentTheme()];
    document.querySelectorAll(".theme-toggle").forEach(function (btn) {
      btn.innerHTML = meta.icon + (btn.classList.contains("theme-row") ? "<span>" + meta.short + " · ganti</span>" : "");
      btn.title = meta.label + " — klik untuk ganti";
      btn.setAttribute("aria-label", meta.label + ", klik untuk ganti");
    });
  }
  function cycleTheme() {
    var next = THEME_ORDER[(THEME_ORDER.indexOf(currentTheme()) + 1) % THEME_ORDER.length];
    if (next === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", next);
    try {
      if (next === "auto") localStorage.removeItem(THEME_KEY);
      else localStorage.setItem(THEME_KEY, next);
    } catch (e) { /* storage unavailable: theme still applies this session */ }
    renderThemeButton();
    showToast(THEME_META[next].label);
  }
  document.querySelectorAll(".theme-toggle").forEach(function (btn) { btn.addEventListener("click", cycleTheme); });
  renderThemeButton();

  async function init() {
    var cfg = window.SHAISTANAYA_CONFIG || {};
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase) {
      startLocal();
      return;
    }
    var client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    var logout = async function () {
      await client.auth.signOut();
      location.reload();
    };
    document.getElementById("logout-btn").addEventListener("click", logout);
    document.getElementById("logout-btn-m").addEventListener("click", logout);
    var sessionRes = await client.auth.getSession();
    var session = sessionRes.data && sessionRes.data.session;
    if (session) startWithSupabase(client, session);
    else showLogin(client);
  }

  init();
})();
</script>
