<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  try {
    var savedTheme = localStorage.getItem("shaistanaya_theme");
    if (savedTheme === "light" || savedTheme === "dark") document.documentElement.setAttribute("data-theme", savedTheme);
  } catch (e) { /* storage unavailable: follow system theme */ }
</script>
<title>Shaistanaya CRM</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1F2F5;
    --panel: #FFFFFF;
    --panel-sunken: #F6F7F9;
    --line: #ECEDF1;
    --line-strong: #E1E3E9;
    --ink: #14161A;
    --muted: #767B85;
    --accent: #A8812F;
    --accent-text: #7A5C1B;
    --urgent: #8A4B0F;
    --accent-ink: #FFFFFF;
    --accent-soft: #F3EAD3;
    --success: #1F8A4C;
    --success-soft: #E3F6E9;
    --warning: #B4740A;
    --warning-soft: #FCF0D8;
    --danger: #D1445B;
    --danger-soft: #FCE4E9;
    color-scheme: light;
    --radius: 16px;
    --radius-md: 10px;
    --radius-pill: 999px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101114;
      --panel: #18191D;
      --panel-sunken: #1E2025;
      --line: #2B2D33;
      --line-strong: #383A41;
      --ink: #EDEEF0;
      --muted: #9599A2;
      --accent: #C9A24B;
      --accent-text: #E2C273;
      --urgent: #E3A857;
      --accent-ink: #17110C;
      --accent-soft: #382E17;
      --success: #4ADE80;
      --success-soft: #163923;
      --warning: #F2B84B;
      --warning-soft: #3A2C11;
      --danger: #F27087;
      --danger-soft: #3A1B22;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101114;
    --panel: #18191D;
    --panel-sunken: #1E2025;
    --line: #2B2D33;
    --line-strong: #383A41;
    --ink: #EDEEF0;
    --muted: #9599A2;
    --accent: #C9A24B;
    --accent-text: #E2C273;
    --urgent: #E3A857;
    --accent-ink: #17110C;
    --accent-soft: #382E17;
    --success: #4ADE80;
    --success-soft: #163923;
    --warning: #F2B84B;
    --warning-soft: #3A2C11;
    --danger: #F27087;
    --danger-soft: #3A1B22;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: var(--safe-t); }
  html, body {
    background: var(--bg);
    color: var(--ink);
  }
  body {
    margin: 0;
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-top: var(--safe-t);
    padding-bottom: calc(var(--safe-b) + 16px);
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  .display { font-weight: 700; letter-spacing: -0.02em; }
  #app {
    max-width: 920px;
    margin: 0 auto;
    animation: appear .4s ease both;
  }
  @keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #app { animation: none; } }

  .sidebar {
    position: sticky;
    top: var(--safe-t);
    z-index: 20;
    background: var(--panel);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .content { padding: 16px 16px 40px; }

  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo {
    flex: none;
    height: 40px; width: auto;
    display: block;
  }
  .brand-text h1 {
    font-size: 1.1rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
    line-height: 1.15;
  }
  .brand-text .sub {
    color: var(--muted);
    font-size: 0.74rem;
    margin-top: 1px;
  }
  .menu-label { display: none; }
  .sidebar-foot { display: none; }

  nav.tabs {
    display: flex;
    gap: 2px;
    margin-top: 12px;
    background: var(--panel-sunken);
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    padding: 3px;
    width: fit-content;
  }
  nav.tabs button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.83rem;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  nav.tabs button[hidden] { display: none !important; }
  nav.tabs button svg { flex: none; opacity: 0.8; }
  nav.tabs button.active {
    background: var(--panel);
    color: var(--ink);
    box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(20,20,20,0.06);
    font-weight: 600;
  }
  nav.tabs button.active svg { opacity: 1; color: var(--accent); }
  nav.tabs button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  @media (min-width: 960px) {
    #app {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      max-width: 1200px;
      align-items: start;
    }
    .sidebar {
      position: sticky;
      top: var(--safe-t);
      height: calc(100vh - var(--safe-t));
      background: var(--panel);
      border-bottom: none;
      border-right: 1px solid var(--line);
      padding: 26px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .brand-logo { height: 48px; }
    .brand-text h1 { font-size: 1.15rem; }
    .menu-label {
      display: block;
      margin: 26px 10px 8px;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .sidebar-foot {
      display: block;
      margin-top: auto;
      color: var(--muted);
      font-size: 0.72rem;
      background: var(--panel-sunken);
      border-radius: var(--radius-md);
      padding: 11px 12px;
    }
    nav.tabs {
      display: flex;
      flex-direction: column;
      background: transparent;
      border: none;
      padding: 0;
      margin-top: 0;
      gap: 2px;
      width: auto;
    }
    nav.tabs button {
      color: var(--muted);
      padding: 9px 10px;
      width: 100%;
      justify-content: flex-start;
      border-left: 3px solid transparent;
      border-radius: var(--radius-md);
      font-size: 0.87rem;
    }
    nav.tabs button.active {
      background: var(--accent-soft);
      color: var(--ink);
      box-shadow: none;
      border-left: 3px solid var(--accent);
    }
    nav.tabs button.active svg { color: var(--accent); }
    .content { padding: 30px 36px 60px; }
  }

  section.view { display: none; }
  section.view.active { display: block; }
  .app-loading {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 60px 10px;
    color: var(--muted);
    font-size: 0.9rem;
    justify-content: center;
  }
  .app-loading.show { display: flex; }
  .app-loading::before {
    content: "";
    width: 16px; height: 16px;
    border-radius: 50%;
    border: 2px solid var(--line-strong);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .app-loading.error::before { display: none; }
  .app-loading.error { color: var(--urgent); }
  @media (prefers-reduced-motion: reduce) { .app-loading::before { animation: none; } }

  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .page-title {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 3px;
  }
  .page-sub { color: var(--muted); font-size: 0.86rem; margin: 0; }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 16px 15px;
    box-shadow: 0 1px 2px rgba(20,20,20,0.03);
  }
  .stat-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .stat-icon {
    flex: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--panel-sunken);
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
  }
  .stat .label {
    font-size: 0.76rem;
    color: var(--muted);
  }
  .stat .value {
    font-size: 1.65rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .stat-link { appearance: none; text-align: left; font: inherit; color: inherit; cursor: pointer; display: block; width: 100%; }
  .stat-link:hover { border-color: var(--line-strong); box-shadow: 0 2px 8px rgba(20, 20, 20, 0.07); }
  .stat-sub { margin-top: 6px; font-size: 0.74rem; color: var(--muted); }
  .stat .value small { font-size: 0.92rem; font-weight: 500; color: var(--muted); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 20px 22px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(20,20,20,0.03);
  }
  .panel h2 {
    font-size: 1.02rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 3px;
  }
  .panel .hint {
    color: var(--muted);
    font-size: 0.8rem;
    margin: 0 0 16px;
  }

  .bar-row { margin-bottom: 12px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-row .bar-top {
    display: flex;
    justify-content: space-between;
    font-size: 0.83rem;
    margin-bottom: 5px;
  }
  .bar-row .bar-top .name { font-weight: 500; }
  .bar-row .bar-top .pct { color: var(--muted); }
  .bar-track {
    height: 7px;
    background: var(--panel-sunken);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: var(--radius-pill);
    width: 0;
    transition: width 0.7s cubic-bezier(.2,.7,.3,1);
  }
  @media (prefers-reduced-motion: reduce) {
    .bar-fill { transition: none; }
  }

  .funnel { display: flex; flex-direction: column; gap: 0; }
  .funnel-step {
    display: grid;
    grid-template-columns: 20px 1fr auto auto;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.86rem;
  }
  .funnel-step:last-child { border-bottom: none; }
  .funnel-step .n { color: var(--muted); font-size: 0.78rem; }
  .funnel-step .count { font-weight: 700; min-width: 34px; text-align: right; }
  .funnel-step .rate { color: var(--muted); font-size: 0.78rem; min-width: 42px; text-align: right; }
  .funnel-note {
    margin-top: 10px;
    font-size: 0.78rem;
    color: var(--muted);
    border-top: 1px dashed var(--line);
    padding-top: 10px;
  }

  table.leads {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  table.leads th {
    text-align: left;
    font-weight: 600;
    color: var(--muted);
    font-size: 0.73rem;
    padding: 0 10px 10px 0;
    border-bottom: 1px solid var(--line-strong);
  }
  table.leads td {
    padding: 13px 10px 13px 0;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  .kpi-bar { display: inline-block; vertical-align: middle; width: 70px; height: 6px; background: var(--panel-sunken); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin-right: 6px; }
  .kpi-bar i { display: block; height: 100%; background: var(--accent); }
  table.kpi th, table.kpi td { white-space: nowrap; }
  table.leads tbody tr { cursor: pointer; }
  table.leads tbody tr:hover td { background: var(--panel-sunken); }
  .badge {
    display: inline-block;
    font-size: 0.71rem;
    font-weight: 600;
    letter-spacing: 0.005em;
    padding: 3px 9px;
    border-radius: var(--radius-pill);
    white-space: nowrap;
  }
  .badge.s-masuk { background: var(--panel-sunken); color: var(--muted); }
  .badge.s-direspon { background: var(--accent-soft); color: var(--accent-text); }
  .badge.s-followup { background: var(--warning-soft); color: var(--warning); }
  .badge.s-janjian { background: var(--warning-soft); color: var(--warning); }
  .badge.s-deal { background: var(--success-soft); color: var(--success); }
  .badge.s-lost { background: var(--panel-sunken); color: var(--urgent); border: 1px solid var(--line-strong); }
  .badge.t-hot { background: var(--ink); color: var(--panel); }
  .badge.t-warm { background: var(--warning-soft); color: var(--warning); }
  .badge.t-cold { background: var(--panel-sunken); color: var(--muted); border: 1px solid var(--line-strong); }
  .badge.t-none { background: transparent; color: var(--muted); border: 1px dashed var(--line-strong); }
  .signals { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 14px; background: var(--panel); }
  .detail .signals { grid-column: 1/-1; }
  .signals-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .signals-head .k { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  .signals-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 18px; }
  .signal-group .sg-title { font-size: 0.76rem; font-weight: 700; margin-bottom: 6px; }
  .signal-group .sg-title span { font-weight: 400; color: var(--muted); }
  .sg-strong .sg-title { color: var(--accent-text); }
  .sg-medium .sg-title { color: var(--warning); }
  .sg-negative .sg-title { color: var(--muted); }
  .signal-group .checkbox-label { font-size: 0.8rem; align-items: flex-start; margin-bottom: 6px; line-height: 1.35; }
  .signal-group .checkbox-label input { margin-top: 1px; flex: none; }
  @media (max-width: 800px) { .signals-grid { grid-template-columns: 1fr; } }
  .sla-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; }
  .sla-good { background: var(--success); }
  .sla-mid { background: var(--warning); }
  .sla-bad { background: var(--urgent); }
  .stale-cell { color: var(--urgent); font-weight: 600; }

  .detail-row td { background: var(--panel-sunken); cursor: default; }
  .detail-row:hover td { background: var(--panel-sunken); }
  .detail {
    padding: 14px 4px 4px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .detail .field { font-size: 0.82rem; }
  .detail .field .k { color: var(--muted); font-size: 0.72rem; margin-bottom: 2px; }
  .detail .notes { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; }
  .detail .notes ul { list-style: none; margin: 0 0 8px; padding: 0; }
  .detail .notes li { font-size: 0.8rem; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .detail .notes li:last-child { border-bottom: none; }
  .detail .notes li .t { color: var(--muted); font-size: 0.7rem; margin-right: 6px; }
  .detail .note-add { display: flex; gap: 6px; grid-column: 1/-1; }
  .detail .stage-row { grid-column: 1/-1; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .detail .strategy-wrap { grid-column: 1/-1; }
  .strategy-box { background: var(--accent-soft); border-radius: var(--radius-md); padding: 12px 14px; }
  .strategy-head { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 5px; }
  .strategy-goal { font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; line-height: 1.35; }
  .strategy-contact { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
  .strategy-contact.warn { color: var(--urgent); font-weight: 600; }
  .strategy-actions { margin: 0 0 8px; padding-left: 17px; font-size: 0.82rem; }
  .strategy-actions li { margin-bottom: 4px; }
  .strategy-script { background: var(--panel); border-radius: var(--radius-md); padding: 8px 10px; font-size: 0.8rem; font-style: italic; margin-bottom: 8px; }
  .strategy-script .k { font-style: normal; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 3px; }
  .strategy-avoid { font-size: 0.78rem; color: var(--urgent); }
  .strategy-cluster { background: var(--panel); border-radius: var(--radius-md); padding: 10px 12px; margin-bottom: 8px; }
  .strategy-cluster .k { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 5px; }
  .cluster-note-text { font-size: 0.82rem; margin-bottom: 9px; line-height: 1.45; }
  .cluster-note-text p { margin: 0 0 6px; }
  .cluster-note-text ul, .cluster-note-text ol { margin: 2px 0 8px; padding-left: 18px; }
  .cluster-note-text ol { padding-left: 24px; }
  .cluster-note-text li strong { font-weight: 600; }
  .cluster-note-text .note-label.block + ol, .cluster-note-text .note-label.block + ul { margin-top: 4px; }
  .usp-panel .strategy-cluster { background: var(--panel-sunken); }
  .usp-panel .cluster-note-text { font-size: 0.86rem; }
  .usp-panel .cluster-note-text .note-label.block { margin-top: 14px; color: var(--accent-text); font-size: 0.74rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .usp-panel .cluster-note-text .note-label.block:first-child { margin-top: 0; }
  .cluster-note-text li { margin-bottom: 3px; }
  .cluster-note-text .note-label { font-weight: 700; }
  .cluster-note-text .note-label.block { display: block; margin-top: 2px; }
  .cluster-note-edit { display: flex; flex-direction: column; gap: 8px; }
  .cluster-note-edit textarea { min-height: 190px; font-size: 0.84rem; line-height: 1.45; }
  .cluster-note-edit .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .cluster-note-edit .tip { color: var(--muted); font-size: 0.72rem; margin-left: auto; }

  label { display: block; font-size: 0.78rem; color: var(--muted); margin: 0 0 4px; }
  label .opt { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: 0.75; }
  select, input[type=text], input[type=tel], input[type=date], input[type=datetime-local], textarea {
    width: 100%;
    font: inherit;
    font-size: 0.9rem;
    padding: 9px 11px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-md);
    background: var(--panel);
    color: var(--ink);
  }
  textarea { resize: vertical; min-height: 44px; }
  .field-wrap { margin-bottom: 14px; }
  .checkbox-label { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 0.86rem; cursor: pointer; }
  .checkbox-label input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  .filter-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; margin-bottom: 4px; }
  .range-bar { padding: 14px 20px 0; }
  .range-bar .filter-bar { max-width: 560px; }
  .filter-summary { display: flex; justify-content: space-between; align-items: center; margin: 2px 0 14px; flex-wrap: wrap; gap: 8px; }
  .chart-toggle {
    display: flex;
    gap: 2px;
    background: var(--panel-sunken);
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    padding: 2px;
  }
  .chart-toggle button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.76rem;
    font-weight: 500;
    padding: 4px 11px;
    border-radius: var(--radius-pill);
    cursor: pointer;
  }
  .chart-toggle button.active {
    background: var(--panel);
    color: var(--ink);
    box-shadow: 0 0 0 1px var(--line);
    font-weight: 600;
  }

  button.primary {
    appearance: none;
    border: none;
    background: var(--ink);
    color: var(--panel);
    font: inherit;
    font-size: 0.86rem;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: var(--radius-md);
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(20,20,20,0.14);
  }

  // Light formatting for cluster notes: line breaks, "- " / "• " bullets,
  // and a short "Label:" at the start of a line shown in bold.
  function formatNote(text) {
    var html = "", listOpen = null;
    function openList(tag) {
      if (listOpen === tag) return;
      closeList();
      html += "<" + tag + ">";
      listOpen = tag;
    }
    function closeList() { if (listOpen) { html += "</" + listOpen + ">"; listOpen = null; } }
    String(text).split(/\r?\n/).forEach(function (raw) {
      var line = raw.trim();
      if (!line) { closeList(); return; }
      var bullet = line.match(/^[-•*]\s+(.*)$/);
      if (bullet) {
        openList("ul");
        html += "<li>" + escapeHtml(bullet[1]) + "</li>";
        return;
      }
      // "12. Point — explanation": keep the number, bold the point.
      var numbered = line.match(/^(\d{1,3})[.)]\s+(.*)$/);
      if (numbered) {
        openList("ol");
        var parts = numbered[2].split(" — ");
        var body = parts.length > 1
          ? "<strong>" + escapeHtml(parts[0]) + "</strong> — " + escapeHtml(parts.slice(1).join(" — "))
          : escapeHtml(numbered[2]);
        html += '<li value="' + numbered[1] + '">' + body + "</li>";
        return;
      }
      closeList();
      if (/:$/.test(line)) {
        html += '<span class="note-label block">' + escapeHtml(line) + "</span>";
        return;
      }
      var label = line.match(/^([^:]{1,24}):\s*(.*)$/);
      if (label && !/^https?$/i.test(label[1])) {
        html += label[2]
          ? '<p><span class="note-label">' + escapeHtml(label[1]) + ':</span> ' + escapeHtml(label[2]) + "</p>"
          : '<span class="note-label block">' + escapeHtml(label[1]) + ":</span>";
      } else {
        html += "<p>" + escapeHtml(line) + "</p>";
      }
    });
    closeList();
    return html;
  }

  function renderClusterFocus(minat, title) {
    if (!minat || minat === "—") return "";
    var note = clusterNotes[minat];
    var html = '<div class="strategy-cluster">';
    if (title !== "") html += '<div class="k">' + (title == null ? "Fokus jual — " + escapeHtml(minat) : escapeHtml(title)) + '</div>';
    if (editingCluster === minat) {
      html += '<div class="cluster-note-edit"><textarea placeholder="Target: …&#10;Direspon:&#10;- poin pertama&#10;- poin kedua" data-cluster-note-input="' + escapeHtml(minat) + '">' + escapeHtml(note || "") + '</textarea>';
      html += '<div class="actions"><button type="button" class="ghost" data-action="save-cluster-note" data-minat="' + escapeHtml(minat) + '">Simpan</button>';
      html += '<button type="button" class="ghost" data-action="cancel-cluster-note" data-minat="' + escapeHtml(minat) + '">Batal</button>';
      html += '<span class="tip">Enter = baris baru · awali "- " untuk bullet · "Judul:" di awal baris jadi tebal</span></div></div>';
    } else if (note) {
      html += '<div class="cluster-note-text">' + formatNote(note) + '</div>';
      if (isAdmin()) html += '<button type="button" class="ghost" data-action="edit-cluster-note" data-minat="' + escapeHtml(minat) + '">Ubah catatan</button>';
    } else if (!isAdmin()) {
      html += '<div class="hint" style="margin:0">Belum ada catatan strategi untuk ' + escapeHtml(minat) + '.</div>';
    } else {
      html += '<div class="hint" style="margin:0 0 8px">Belum ada catatan strategi khusus untuk ' + escapeHtml(minat) + '. Tambahkan sekali, otomatis kepakai di semua lead yang minatnya sama.</div>';
      html += '<button type="button" class="ghost" data-action="edit-cluster-note" data-minat="' + escapeHtml(minat) + '">+ Tambah catatan</button>';
    }
    html += '</div>';
    return html;
  }

  function buildStrategyHtml(lead) {
    var s = STRATEGY[lead.stage];
    if (!s) return "";
    var group = sourceGroupOf(lead.source);
    var minatLabel = (lead.minat && lead.minat !== "—") ? lead.minat : "unit ini";
    var html = '<div class="strategy-box">';
    html += '<div class="strategy-head">Strategi untuk tahap ' + STAGE_LABEL[lead.stage] + '</div>';
    var fu = followUpCount(lead);
    var overdue = lead.stage === "Follow Up" && fu >= 3;
    html += '<div class="strategy-contact' + (overdue ? ' warn' : '') + '">' + (overdue ? '⚠️ ' : '') +
      'Kontak terakhir ' + contactLabel(lead) + ' · sudah ' + fu + ' kali dikontak' +
      (overdue ? ' — 3x+ follow up belum closing, pertimbangkan pindah ke nurture jangka panjang' : '') + '</div>';
    html += '<div class="strategy-goal">' + escapeHtml(s.goal) + '</div>';
    if (s.actions && s.actions.length) {
      html += '<ul class="strategy-actions">';
      s.actions.forEach(function (a) { html += '<li>' + escapeHtml(a) + '</li>'; });
      html += '</ul>';
    }
    html += renderClusterFocus(lead.minat);
    if (s.scripts && s.scripts[group]) {
      var scriptText = s.scripts[group].split("{{minat}}").join(minatLabel);
      html += '<div class="strategy-script"><div class="k">Contoh pembuka (' + escapeHtml(group) + ')</div>"' + escapeHtml(scriptText) + '"</div>';
    }
    if (s.avoid) {
      html += '<div class="strategy-avoid">Hindari: ' + escapeHtml(s.avoid) + '</div>';
    }
    html += '</div>';
    return html;
  }

  var DOMISILI = ["Sidoarjo", "Surabaya", "Gresik", "Krian", "Malang", "Mojokerto"];
  var MINAT_GROUPS = [
    { group: "Cluster Sierra", options: ["Bianca Garden", "Bianca Deluxe", "Arnica Garden", "Arnica Pool", "Bianca Deluxe Hook", "Arnica Garden Hook", "Arnica Pool Hook"] },
    { group: "Cluster Montana", options: ["Gwen", "New Gwen", "Darlene", "Gwen Hook", "New Gwen Hook", "Angeline Hook"] }
  ];
  var MINAT = MINAT_GROUPS[0].options.concat(MINAT_GROUPS[1].options);
  var NAMES = ["Dewi Anggraini", "Bayu Saputra", "Rina Kartika", "Fajar Nugroho", "Siti Aminah", "Hendra Wijaya",
    "Putri Lestari", "Agus Setiawan", "Maya Puspita", "Rizky Ramadhan", "Nur Halimah", "Dimas Prakoso",
    "Indah Permata", "Yoga Pratama", "Wulan Sari", "Andika Firmansyah", "Lestari Ningsih", "Eko Prasetyo",
    "Anisa Rahma", "Fajrul Falah", "Citra Ayu", "Teguh Santoso", "Diah Ratnasari", "Wahyu Hidayat"];
  var SAMPLE_NOTES = ["Tanya cicilan per bulan", "Minta brosur digital", "Follow up via WA, belum dibalas",
    "Sudah dikirim lokasi & harga", "Tertarik tapi masih bandingkan cluster lain", "Nanya jadwal survey lokasi",
    "Minta simulasi KPR", "Nanya DP minimal"];

  function uid() { return Math.random().toString(36).slice(2, 10); }

  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
  function pickWeighted(rng, pairs) {
    var total = pairs.reduce(function (s, p) { return s + p[1]; }, 0);
    var r = rng() * total;
    for (var i = 0; i < pairs.length; i++) {
      r -= pairs[i][1];
      if (r <= 0) return pairs[i][0];
    }
    return pairs[pairs.length - 1][0];
  }

  function genPhone(rng) {
    var n = "08";
    for (var i = 0; i < 9; i++) n += Math.floor(rng() * 10);
    return n;
  }

  function seedData() {
    var rng = mulberry32(20260923);
    var leads = [];
    var sourceWeights = [
      ["Facebook Ads", 38], ["Facebook Organic", 8],
      ["Instagram Ads", 17], ["Instagram Organic", 6], ["Instagram Story", 3], ["Instagram DM", 3],
      ["WhatsApp Ads (Click to Chat)", 11], ["WhatsApp Business Chat", 8],
      ["Website Form", 4], ["Website Live Chat", 2]
    ];
    var now = new Date(2026, 8, 23, 17, 0, 0);
    var count = 58;
    for (var i = 0; i < count; i++) {
      var daysAgo = Math.floor(rng() * 23);
      var created = new Date(2026, 8, 23 - daysAgo, 8 + Math.floor(rng() * 11), Math.floor(rng() * 60));
      if (created > now) created = new Date(now.getTime() - 3600000);
      var source = pickWeighted(rng, sourceWeights);

      var stageRoll = rng();
      var stage, lost = false, lossRank = null;
      if (stageRoll < 0.14) { stage = "Masuk"; }
      else if (stageRoll < 0.42) { stage = "Direspon"; }
      else if (stageRoll < 0.62) { stage = "Follow Up"; }
      else if (stageRoll < 0.78) { stage = "Janjian"; }
      else if (stageRoll < 0.90) { stage = "Deal"; }
      else {
        stage = "Lost";
        lost = true;
        var priorRoll = rng();
        lossRank = priorRoll < 0.35 ? 0 : priorRoll < 0.65 ? 1 : priorRoll < 0.85 ? 2 : 3;
      }

      var respondedAt = null;
      var responseMinutes = null;
      var willRespond = stage !== "Masuk";
      if (willRespond) {
        responseMinutes = Math.floor(rng() * rng() * 180) + 3;
        respondedAt = new Date(created.getTime() + responseMinutes * 60000);
        if (respondedAt > now) { respondedAt = null; responseMinutes = null; }
      }

      var notes = [];
      if (stage !== "Masuk") {
        var noteCount = stage === "Masuk" ? 0 : (rng() < 0.6 ? 1 : 2);
        for (var n = 0; n < noteCount; n++) {
          var noteTime = new Date(created.getTime() + (n + 1) * (30 + rng() * 600) * 60000);
          if (noteTime > now) noteTime = now;
          notes.push({ ts: noteTime.toISOString(), text: pick(rng, SAMPLE_NOTES) });
        }
      }

      leads.push({
        id: uid(),
        createdAt: created.toISOString(),
        respondedAt: respondedAt ? respondedAt.toISOString() : null,
        source: source,
        nama: pick(rng, NAMES),
        telp: genPhone(rng),
        domisili: pick(rng, DOMISILI),
        minat: pick(rng, MINAT),
        stage: stage,
        lossRank: lossRank,
        notes: notes
      });
    }
    leads.sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
    return leads;
  }

  function loadStateLocal() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* storage unavailable */ }
    return [];
  }

  function saveStateLocal(leadsArr) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(leadsArr)); }
    catch (e) { /* ignore — demo still works in-memory this session */ }
  }

  var db = null; // Supabase client once signed in; null = use localStorage fallback

  function leadToRow(l) {
    return {
      id: l.id,
      created_at: l.createdAt,
      responded_at: l.respondedAt,

      telp: l.telp,
      domisili: l.domisili,
      minat: l.minat,
      stage: l.stage,
      loss_rank: l.lossRank,
      notes: l.notes || [],
      signals: l.signals || [],
      next_at: l.nextAt || null,
      next_note: l.nextNote || null,
      survey_at: l.surveyAt || null,
      ajak_at: l.ajakAt || null,
      konfirm_at: l.konfirmAt || null,
      done_at: l.doneAt || null,
      objections: l.objections || [],
      owner_email: l.owner || undefined
    };
  }
  function rowToLead(r) {
    return {
      id: r.id,
      createdAt: r.created_at,
      respondedAt: r.responded_at,
      source: r.source,
      nama: r.nama,
      telp: r.telp,

      surveyAt: r.survey_at || null,
      ajakAt: r.ajak_at || null,
      konfirmAt: r.konfirm_at || null,
      doneAt: r.done_at || null,
      objections: r.objections || [],
      owner: r.owner_email || ""
    };
  }

  function reportDbError(error) {
    if (error) showToast("Gagal simpan ke server (" + (error.code || error.message || "error") + ")");
  }

  function persistLead(lead) {
    if (db) {
      db.from("leads").upsert(leadToRow(lead)).then(function (res) { reportDbError(res.error); });
    } else {
      saveStateLocal(leads);
    }
  }

  function deleteLead(lead) {
    var idx = leads.indexOf(lead);
    if (idx === -1) return;
    leads.splice(idx, 1);
    if (expandedId === lead.id) expandedId = null;
    refreshAll();
    if (!db) {
      saveStateLocal(leads);
      showToast("Lead dihapus");
      return;
    }
    db.from("leads").delete().eq("id", lead.id).select("id").then(function (res) {
      if (res.error || !res.data || !res.data.length) {
        // Put it back so the screen matches the server.
        leads.splice(Math.min(idx, leads.length), 0, lead);
        refreshAll();
        showToast("Gagal menghapus lead" + (res.error ? " (" + (res.error.code || res.error.message) + ")" : ""));
      } else {
        showToast("Lead dihapus");
      }
    });
  }

  function persistClusterNote(minat, note) {
    if (db) {
      var q = note
        ? db.from("cluster_notes").upsert({ minat: minat, note: note })
        : db.from("cluster_notes").delete().eq("minat", minat);
      q.then(function (res) { reportDbError(res.error); });
    } else {
      saveClusterNotesLocal(clusterNotes);
    }
  }

  var leads = []; // populated by init(): the signed-in user's own leads (admin: Lead Kantor)
  var teamLeads = []; // admin only: leads owned by marketing accounts
  var teamMembers = []; // admin only: [{email, nama, role}]
  var me = { email: "", nama: "", role: "admin" }; // local/offline mode = admin
  function isAdmin() { return me.role === "admin"; }
  function placeLoaded(list) {
    // Admin gets every row from the server; split them into own vs. marketing.
    list.forEach(function (l) {
      if (isAdmin() && l.owner && l.owner !== me.email) teamLeads.push(l); else leads.push(l);
    });
  }
  var expandedId = null;
  var editingLeadId = null;
  var editingCluster = null;

  var CLUSTER_NOTES_KEY = "shaistanaya_cluster_notes_v1";
  // Stored alongside the per-unit notes so the team can edit it from the Playbook.

    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function csvEscape(v) {
    var s = v == null ? "" : String(v);
    if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function leadsToCsv(list) {
    var headers = ["Tanggal", "Jam Masuk", "Jam Respon", "Sumber", "Nama", "No Telp", "Domisili",
      "Minat/Unit", "Tahap", "Funnel", "Hari Sejak Kontak Terakhir", "Jumlah Follow Up", "Catatan Terakhir", "Follow Up Berikutnya", "Jadwal Survey"];
    var rows = [headers.map(csvEscape).join(",")];
    list.forEach(function (l) {
      var d = new Date(l.createdAt);
      var tanggal = d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
      var catatanTerakhir = l.notes && l.notes.length ? l.notes[l.notes.length - 1].text : "";
      rows.push([
        tanggal, fmtTime(l.createdAt), l.respondedAt ? fmtTime(l.respondedAt) : "",
        l.source, l.nama, '="' + normPhone(l.telp) + '"', l.domisili, l.minat,
        STAGE_LABEL[l.stage] || l.stage, leadTemperature(l), daysSinceContact(l), followUpCount(l), catatanTerakhir,
        l.nextAt ? l.nextAt + (l.nextNote ? " · " + l.nextNote : "") : "",
        l.surveyAt ? dayKeyLocal(new Date(l.surveyAt)) + " " + jamLabel(l.surveyAt) : ""
      ].map(csvEscape).join(","));

  // ---------- Dashboard ----------

  function computeSourceBreakdown(src) {
    var groups = {};
    src.forEach(function (l) {
      var g = sourceGroupOf(l.source);
      groups[g] = (groups[g] || 0) + 1;
    });
    var total = src.length || 1;
    return Object.keys(groups).map(function (g) {
      return { name: g, count: groups[g], pct: Math.round((groups[g] / total) * 100) };
    }).sort(function (a, b) { return b.count - a.count; });
  }

  function computeResponseStats(src) {
    var responded = src.filter(function (l) { return l.respondedAt; });
    if (!responded.length) return { rate: 0, avgMinutes: null, under15: 0 };
    var totalMin = 0, under15 = 0;
    responded.forEach(function (l) {
      var mins = (new Date(l.respondedAt) - new Date(l.createdAt)) / 60000;
      totalMin += mins;
      if (mins <= 15) under15++;
    });
    return {
      rate: src.length ? Math.round((responded.length / src.length) * 100) : 0,
      avgMinutes: Math.round(totalMin / responded.length),
      under15Pct: Math.round((under15 / responded.length) * 100)
    };
  }

  function computeFunnel(src) {
    var total = src.length;
    return STAGES.map(function (stage, idx) {
      var reached = src.filter(function (l) { return effectiveRank(l) >= idx; }).length;
      return { stage: stage, count: reached, pct: total ? Math.round((reached / total) * 100) : 0 };
    });
  }

  var DASH_PRESETS = [
    ["today", "Hari ini"], ["7", "7 hari terakhir"], ["30", "30 hari terakhir"],
    ["month", "Bulan ini"], ["lastmonth", "Bulan lalu"], ["90", "90 hari terakhir"],
    ["year", "Tahun ini"], ["all", "Semua waktu"], ["custom", "Custom…"]
  ];
  var dashRange = { preset: "month", from: "", to: "" };

  function parseDayKey(k) {
    var p = k.split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function endOfDay(d) { var e = new Date(d); e.setHours(23, 59, 59, 999); return e; }
  function fmtDayLong(d) { return d.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }); }

  function resolveDashRange() {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var start, end = endOfDay(today), label;
    var preset = dashRange.preset;
    if (preset === "custom" && (!dashRange.from || !dashRange.to)) preset = "month";
    if (preset === "today") { start = today; }
    else if (preset === "7" || preset === "30" || preset === "90") {
      start = new Date(today); start.setDate(start.getDate() - (+preset - 1));
    } else if (preset === "month") { start = new Date(today.getFullYear(), today.getMonth(), 1); }
    else if (preset === "lastmonth") {
      start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
      end = endOfDay(new Date(today.getFullYear(), today.getMonth(), 0));
    } else if (preset === "year") { start = new Date(today.getFullYear(), 0, 1); }
    else if (preset === "all") {
      start = leads.reduce(function (min, l) {
        var d = new Date(l.createdAt); return d < min ? d : min;
      }, today);
      start = new Date(start); start.setHours(0, 0, 0, 0);
    } else {
      start = parseDayKey(dashRange.from);
      end = endOfDay(parseDayKey(dashRange.to));
      if (start > end) { var t = start; start = new Date(end); start.setHours(0, 0, 0, 0); end = endOfDay(t); }
    }
    if (preset === "custom") label = fmtDayLong(start) + " – " + fmtDayLong(end);
    else label = DASH_PRESETS.filter(function (p) { return p[0] === preset; })[0][1] +
      (preset === "all" || preset === "today" ? "" : " (" + fmtDayLong(start) + " – " + fmtDayLong(end) + ")");
    return { start: start, end: end, label: label, all: preset === "all" };
  }

  function renderDashRangeBar() {
    var html = '<div class="panel range-bar"><div class="filter-bar">';
    html += '<div class="field-wrap"><label for="dash-preset">Rentang waktu</label><select id="dash-preset">';
    DASH_PRESETS.forEach(function (p) {
      html += '<option value="' + p[0] + '"' + (dashRange.preset === p[0] ? " selected" : "") + '>' + p[1] + '</option>';
    });
    html += '</select></div>';
    if (dashRange.preset === "custom") {
      html += '<div class="field-wrap"><label for="dash-from">Dari tanggal</label><input type="date" id="dash-from" value="' + escapeHtml(dashRange.from) + '"></div>';
      html += '<div class="field-wrap"><label for="dash-to">Sampai tanggal</label><input type="date" id="dash-to" value="' + escapeHtml(dashRange.to) + '"></div>';
    }
    html += '</div></div>';
    return html;
  }

  function bindDashRangeBar() {
    document.getElementById("dash-preset").addEventListener("change", function (e) {
      dashRange.preset = e.target.value;
      if (dashRange.preset === "custom" && !dashRange.from) {
        var r = resolveDashRange();
        dashRange.from = dayKeyLocal(r.start);
        dashRange.to = dayKeyLocal(r.end);
      }
      renderDashboard();
    });
    var fromEl = document.getElementById("dash-from");
    var toEl = document.getElementById("dash-to");
    if (fromEl) fromEl.addEventListener("change", function (e) { if (e.target.value) { dashRange.from = e.target.value; renderDashboard(); } });
    if (toEl) toEl.addEventListener("change", function (e) { if (e.target.value) { dashRange.to = e.target.value; renderDashboard(); } });
  }

  function renderDashboard() {
    var el = document.getElementById("view-dashboard");

    if (needsHistory) ensureHistoryLoaded();

      var d = new Date(l.createdAt);
      return d >= range.start && d <= range.end;
    });
    var total = dashLeads.length;
    var resp = computeResponseStats(dashLeads);
    var sources = computeSourceBreakdown(dashLeads);
    var funnel = computeFunnel(dashLeads);
    var lostCount = dashLeads.filter(function (l) { return l.stage === "Lost"; }).length;

    var maxSourceCount = sources.length ? sources[0].count : 1;

    var html = "";

    html += '<div class="stat"><div class="stat-top"><span class="stat-icon">' + ICONS.check + '</span><span class="label">Sudah direspon</span></div><div class="value mono">' + resp.rate + '<small>%</small></div></div>';
    html += '<div class="stat"><div class="stat-top"><span class="stat-icon">' + ICONS.survey + '</span><span class="label">Survey</span></div><div class="value mono">' + surveyCount + '</div></div>';
    // Snapshot of the pipeline right now (not limited to the date range): active leads rated Hot.
    var hotActive = leads.filter(function (l) { return activeLead(l) && leadTemperature(l) === "Hot"; });
    var hotNoPlan = hotActive.filter(function (l) { return !l.surveyAt && !l.ajakAt; }).length;
    html += '<button type="button" class="stat stat-link" id="stat-hot" title="Lihat lead Hot yang masih aktif"><div class="stat-top"><span class="stat-icon">' + ICONS.bolt + '</span><span class="label">Lead Hot aktif</span></div><div class="value mono">' + hotActive.length + '</div>' +
      '<div class="stat-sub">' + (hotActive.length ? (hotNoPlan ? hotNoPlan + " belum punya jadwal survey" : "semua sudah punya rencana survey") : "belum ada lead Hot") + '</div></button>';
    html += '</div>';

    var rangeDays = Math.round((range.end - range.start) / 86400000);
    var effectiveTrendMode = rangeDays > 366 ? "monthly"
      : trendMode === "daily" && rangeDays > 62 ? "weekly" : trendMode;
    var trendData = aggregateTrend(dashLeads, range.start, range.end, effectiveTrendMode);
    html += '<div class="panel">';
    html += '<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">';
    html += '<h2 style="margin:0">Tren Lead Masuk</h2>';

    html += '</div>';
    html += '<p class="hint">' + ({ daily: "Per hari", weekly: "Per minggu, dimulai tiap Senin", monthly: "Per bulan" })[effectiveTrendMode] +
      (effectiveTrendMode !== trendMode
        ? (effectiveTrendMode === "monthly" ? " — rentang lebih dari setahun otomatis ditampilkan per bulan" : " — rentang lebih dari 2 bulan otomatis ditampilkan per minggu")
        : "") + '</p>';
    html += '<div class="table-scroll">' + renderTrendChart(trendData) + '</div>';
    html += '</div>';

    html += '<div class="panel">';
    html += '<h2>Distribusi Sumber Lead</h2>';
    html += '<p class="hint">Persentase dari ' + total + ' lead di rentang ini</p>';
    sources.forEach(function (s) {
      var pctWidth = Math.max(4, Math.round((s.count / maxSourceCount) * 100));
      html += '<div class="bar-row">';
      html += '<div class="bar-top"><span class="name">' + escapeHtml(s.name) + '</span><span class="pct mono">' + s.pct + '% · ' + s.count + '</span></div>';
      html += '<div class="bar-track"><div class="bar-fill" data-w="' + pctWidth + '"></div></div>';
      html += '</div>';
    });
    html += '</div>';

    var conv = computeSourceConversion(dashLeads);
    html += '<div class="panel">';

    html += '<p class="hint">Berapa persen lead dari tiap sumber yang berakhir Deal — bukan cuma volume, tapi kualitasnya</p>';

    });
    html += '</tbody></table></div>';
    html += '</div>';

    var minatBreakdown = computeFieldBreakdown(dashLeads, "minat", 6);
    var domisiliBreakdown = computeFieldBreakdown(dashLeads, "domisili", 6);
    var maxMinat = minatBreakdown.length ? Math.max.apply(null, minatBreakdown.map(function (x) { return x.count; })) : 1;
    var maxDomisili = domisiliBreakdown.length ? Math.max.apply(null, domisiliBreakdown.map(function (x) { return x.count; })) : 1;

    html += '<div class="panel">';
    html += '<h2>Unit / Cluster Paling Diminati</h2>';

      domisiliBreakdown.forEach(function (m) {
        var w2 = Math.max(4, Math.round((m.count / maxDomisili) * 100));

  var DAY_NAMES = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
  var MON_NAMES = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
  function dateFromKey(k) { var p = String(k).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function keyOffset(n) { var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + n); return dayKeyLocal(d); }
  function daysFromToday(k) { var t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((dateFromKey(k) - t) / 86400000); }
  function dayShortLabel(d) { return DAY_NAMES[d.getDay()] + ", " + d.getDate() + " " + MON_NAMES[d.getMonth()]; }
  function dayLabelKey(k) {
    var n = daysFromToday(k), s = dayShortLabel(dateFromKey(k));
    if (n === 0) return "Hari ini";
    if (n === 1) return "Besok · " + s;
    if (n === -1) return "Kemarin · " + s;
    return s;
  }
  function isSameDay(iso, key) { return !!iso && dayKeyLocal(new Date(iso)) === key; }
  function jamLabel(iso) { var d = new Date(iso); return pad2(d.getHours()) + "." + pad2(d.getMinutes()); }
  function minutesSince(iso) { return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000)); }
  function durLabel(min) {
    if (min < 60) return min + " menit";
    if (min < 1440) return Math.floor(min / 60) + " jam";
    return Math.floor(min / 1440) + " hari";
  }
  function initialsOf(n) {
    var w = String(n).replace(/[()]/g, "").trim().split(/\s+/);
    return ((w[0] || "?").charAt(0) + (w[1] ? w[1].charAt(0) : "")).toUpperCase();
  }
  function addNote(lead, text) { lead.notes = lead.notes || []; lead.notes.push({ ts: new Date().toISOString(), text: text }); }
  function activeLead(l) { return !!ACTIVE_STAGES[l.stage]; }

  // ----- tasks -----
  // A lead with no follow-up date is scheduled automatically for AUTO_FU_DAYS after the last contact, so a lead
  // contacted today only shows up tomorrow (no same-day nagging). Cold leads and leads with a survey ahead are not
  // auto-scheduled; they only appear when someone set a date.
  var AUTO_FU_DAYS = 1;
  function effectiveNext(l) {
    if (l.nextAt) return { key: l.nextAt, auto: false };
    var d = new Date(lastContactMs(l)); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + AUTO_FU_DAYS);
    return { key: dayKeyLocal(d), auto: true };
  }
  function surveyAhead(l) { return !!l.surveyAt && new Date(l.surveyAt) > new Date(); }
  function autoScheduled(l) { return activeLead(l) && !!l.respondedAt && !l.nextAt && !surveyAhead(l) && leadTemperature(l) !== "Cold"; }
  // Order of checks: not answered yet > survey tomorrow to confirm > follow-up due (Hot with no survey plan first).
  function computeTasks() {
    var today = dayKeyLocal(new Date()), tomorrow = keyOffset(1), out = [];
    leads.forEach(function (l) {
      if (!activeLead(l)) return;
      if (l.doneAt && isSameDay(l.doneAt, today)) return;
      if (!l.respondedAt) { out.push({ l: l, type: "respon", rank: -minutesSince(l.createdAt) }); return; }
      if (l.surveyAt && !l.konfirmAt && isSameDay(l.surveyAt, tomorrow)) {
        out.push({ l: l, type: "konfirmasi", rank: new Date(l.surveyAt).getTime() });
        return;
      }
      if (!l.nextAt && !autoScheduled(l)) return;
      var nx = effectiveNext(l), n = daysFromToday(nx.key);
      if (n > 0) return;                                        // scheduled for a later day
      out.push({ l: l, type: hotNoSurvey(l) ? "hot" : "fu", rank: n, auto: nx.auto });
    });
    out.sort(function (a, b) { return a.rank - b.rank; });
    return out;
  }
  function doneTodayLeads() {
    var today = dayKeyLocal(new Date());
    return leads.filter(function (l) { return activeLead(l) && l.doneAt && isSameDay(l.doneAt, today); });
  }
  var TASK_TYPES = {
    respon: { title: "Segera dibalas", sub: "target respon 15 menit" },
    hot: { title: "Lead Hot yang butuh perhatian", sub: "belum ada jadwal survey" },

  function taskReason(t) {
    var l = t.l;
    if (t.type === "respon") {

      return m > 15 ? { tone: "urgent", text: "Belum direspon " + durLabel(m) + ", lewat target 15 menit" }
        : { tone: "amber", text: "Belum direspon " + m + " menit, " + (15 - m) + " menit lagi menuju batas" };
    }
    if (t.type === "konfirmasi") return { tone: "amber", text: "Survey besok jam " + jamLabel(l.surveyAt) + " · belum dikonfirmasi" };
    var n = -t.rank, how = t.auto ? " (jadwal otomatis)" : "";
    var base = n > 0 ? "follow up telat " + n + " hari" + how : "follow up hari ini" + how;
    if (t.type === "hot") return { tone: "urgent", text: "Hot, " + base + " · belum ada jadwal survey" };
    return n > 0 ? { tone: "urgent", text: base.charAt(0).toUpperCase() + base.slice(1) } : { tone: "ink", text: base.charAt(0).toUpperCase() + base.slice(1) };
  }
  function recoTemplate(l) {

  function parseObjection(text) {

      var m = line.match(/^(Jawaban|Poin|Hindari):\s*(.*)$/i);

        if (m[2]) { if (sec === "jawaban") quote.push(m[2]); else if (sec === "hindari") avoid.push(m[2]); }

      if (sec === "jawaban") quote.push(line);
      else if (sec === "poin") pts.push(line.replace(/^[-•*]\s*/, ""));
      else if (sec === "hindari") avoid.push(line);

    if (a === "tg-sheet-cancel") { tgSheet = null; renderTugas(); return; }

      var tl = leads.find(function (x) { return x.id === tgSheet; });

    }
    if (a === "draft-off") { draftNext.key = keyOffset(parseInt(t.getAttribute("data-off"), 10)); rerenderAfterDraft(); return; }
    if (a === "nx-edit") { nxEditing = id; draftNext = { key: lead.nextAt && daysFromToday(lead.nextAt) >= 1 ? lead.nextAt : keyOffset(1), note: lead.nextNote || "" }; refreshAll(); return; }
    if (a === "nx-cancel") { nxEditing = null; refreshAll(); return; }
    if (a === "nx-save") {
      var nl = leads.find(function (x) { return x.id === nxEditing; });

  function teamKpi(list) {
    var inP = list.filter(teamInPeriod);

    var fast = inP.filter(function (l) { return l.respondedAt && (new Date(l.respondedAt) - new Date(l.createdAt)) / 60000 <= 15; }).length;
    var survey = inP.filter(function (l) { return effectiveRank(l) >= STAGE_RANK["Janjian"]; }).length;
    var deal = inP.filter(function (l) { return l.stage === "Deal"; }).length;
    var lost = inP.filter(function (l) { return l.stage === "Lost"; }).length;
    var active = list.filter(activeLead);
    return {
      total: total, responded: responded, fast: fast, survey: survey, deal: deal, lost: lost,
      respRate: total ? Math.round(responded / total * 100) : 0,
      fastRate: total ? Math.round(fast / total * 100) : 0,
      surveyRate: total ? Math.round(survey / total * 100) : 0,
      hot: active.filter(function (l) { return leadTemperature(l) === "Hot"; }).length,
      stale: active.filter(isStale).length,

    html += '<div class="panel">';
    html += '<h2>Tambah Lead</h2>';
    html += '<p class="hint">No. telp, jam masuk &amp; jam respon wajib diisi — sisanya opsional</p>';
    html += '<form id="lead-form">';
    html += '<div class="form-grid">';

    html += '<div class="field-wrap full"><label for="f-source">Sumber lead <span class="opt">(opsional)</span></label><select id="f-source">';
    html += '<option value="" selected>Belum diketahui / pilih sumber…</option>';
    SOURCE_GROUPS.forEach(function (g) {
      html += '<option value="' + g.group + '">' + g.group + '</option>';
    });
    html += '</select></div>';

    html += '<div class="field-wrap"><label for="f-nama">Nama <span class="opt">(opsional)</span></label><input type="text" id="f-nama"></div>';
    html += '<div class="field-wrap"><label for="f-telp">No. telp <span class="opt">(sudah diawali 62, cukup ketik 8…)</span></label><input type="tel" inputmode="numeric" id="f-telp" value="62" required pattern="' + PHONE_PATTERN + '" title="Awali 62, lalu 8… (total 10-15 digit)" autocomplete="off"></div>';
    html += '<div class="dup-warn" id="f-dup" hidden></div>';
    html += '<div class="field-wrap"><label for="f-created">Jam masuk</label><input type="datetime-local" id="f-created" value="' + nowDatetimeLocalValue() + '" required></div>';
    html += '<div class="field-wrap"><label for="f-responded">Jam respon</label><input type="datetime-local" id="f-responded" value="' + nowDatetimeLocalValue() + '" required></div>';
    html += '<div class="field-wrap"><label for="f-domisili">Domisili <span class="opt">(opsional)</span></label><input type="text" id="f-domisili"></div>';
    html += '<div class="field-wrap"><label for="f-minat">Minat / unit <span class="opt">(opsional)</span></label><select id="f-minat">';
    html += '<option value="" selected>Belum diketahui / pilih unit…</option>';
    MINAT_GROUPS.forEach(function (g) {
      html += '<optgroup label="' + g.group + '">';
      g.options.forEach(function (o) { html += '<option value="' + o + '">' + o + '</option>'; });
      html += '</optgroup>';
    });
    html += '</select></div>';
    html += '<div class="field-wrap full"><label for="f-catatan">Catatan awal <span class="opt">(opsional)</span></label><textarea id="f-catatan"></textarea></div>';
    html += '<div class="field-wrap full">' + signalChecklistHtml([], 'name="f-signal"', "f-temp-badge") + '</div>';

    html += '</div>';
    html += '<button type="submit" class="primary">Simpan Lead</button>';
    html += '</form>';
    html += '</div>';

    html += '<div class="panel">';
    html += '<h2>Masuk Hari Ini</h2>';
    var today = new Date();
    var todays = leads.filter(function (l) {
      var d = new Date(l.createdAt);
      return d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
    });
    html += renderLeadsTable(todays);
    html += '</div>';

    el.innerHTML = html;

    el.querySelectorAll("tr[data-id]").forEach(function (row) {
      row.addEventListener("click", function (e) { if (e.target.closest("[data-wa]")) return; toggleExpand(row.getAttribute("data-id")); });
    });
    bindDetailHandlers(el);

    el.querySelectorAll('input[name="f-signal"]').forEach(function (box) {
      box.addEventListener("change", function () {
        var picked = Array.prototype.map.call(el.querySelectorAll('input[name="f-signal"]:checked'), function (b) { return b.value; });
        document.getElementById("f-temp-badge").innerHTML = tempBadge({ signals: picked });
      });
    });

    bindPhoneInput(document.getElementById("f-telp"));
    var dupAcceptedFor = null; // normalized number the CS chose to save anyway

    function findLocalDuplicate(num) {
      if (num.length < 9) return null;
      return leads.find(function (l) { return normPhone(l.telp) === num; }) || null;
    }
    async function findDuplicate(num) {
      var local = findLocalDuplicate(num);
      if (local || !db || num.length < 9) return local;
      // Older closed leads may not be loaded; ask the server too.
      var dq = db.from("leads").select("*").eq("telp_norm", num);
      if (me.email) dq = dq.eq("owner_email", me.email);
      var res = await dq.order("created_at", { ascending: false }).limit(1);
      if (res.error || !res.data.length) return null;
      var found = rowToLead(res.data[0]);
      if (!leads.some(function (l) { return l.id === found.id; })) {
        leads.push(found);
        leads.sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
      }
      return found;
    }
    function showDuplicate(dup, num) {
      var box = document.getElementById("f-dup");
      if (!dup) { box.hidden = true; box.innerHTML = ""; return; }
      box.hidden = false;
      box.innerHTML = '<strong>Nomor ini sudah tercatat.</strong> ' + escapeHtml(dup.nama) + ' · ' + escapeHtml(STAGE_LABEL[dup.stage] || dup.stage) +
        ' · ' + leadTemperature(dup) + ' · masuk ' + fmtDate(dup.createdAt) +
        '<div class="actions"><button type="button" class="ghost" id="dup-open">Buka lead lama</button>' +
        '<button type="button" class="ghost" id="dup-save">Tetap simpan sebagai lead baru</button></div>';
      document.getElementById("dup-open").addEventListener("click", function () { openLead(dup.id); });
      document.getElementById("dup-save").addEventListener("click", function () {
        dupAcceptedFor = num;
        document.getElementById("lead-form").requestSubmit();
      });
    }

    var dupTimer = null;
    document.getElementById("f-telp").addEventListener("input", function (e) {
      clearTimeout(dupTimer);
      var num = normPhone(e.target.value);
      dupTimer = setTimeout(function () { showDuplicate(findLocalDuplicate(num), num); }, 250);
    });

    document.getElementById("lead-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var telpNum = normPhone(document.getElementById("f-telp").value);
      if (dupAcceptedFor !== telpNum) {
        var dup = await findDuplicate(telpNum);
        if (dup) {
          showDuplicate(dup, telpNum);
          document.getElementById("f-dup").scrollIntoView({ block: "center", behavior: "smooth" });
          return;
        }
      }
      dupAcceptedFor = null;
      var source = document.getElementById("f-source").value;
      var nama = document.getElementById("f-nama").value.trim();
      var telp = document.getElementById("f-telp").value.trim();
      var domisili = document.getElementById("f-domisili").value.trim();
      var minat = document.getElementById("f-minat").value.trim();
      var catatan = document.getElementById("f-catatan").value.trim();
      var signals = Array.prototype.map.call(el.querySelectorAll('input[name="f-signal"]:checked'), function (b) { return b.value; });
      var createdRaw = document.getElementById("f-created").value;
      var respondedRaw = document.getElementById("f-responded").value;
      if (!telp || !createdRaw || !respondedRaw) return;

      var createdDate = createdRaw ? new Date(createdRaw) : new Date();
      if (isNaN(createdDate.getTime())) createdDate = new Date();
      var createdIso = createdDate.toISOString();

      var respondedIso = null;
      if (respondedRaw) {
        var respondedDate = new Date(respondedRaw);
        if (!isNaN(respondedDate.getTime())) respondedIso = respondedDate.toISOString();
      }

      var lead = {
        id: uid(),
        createdAt: createdIso,
        respondedAt: respondedIso,
        source: source || "—",
        nama: nama || "(tanpa nama)",
        telp: telp,
        domisili: domisili || "—",
        minat: minat || "—",
        stage: respondedIso ? "Direspon" : "Masuk",
        lossRank: null,
        notes: catatan ? [{ ts: new Date().toISOString(), text: catatan }] : [],
        signals: signals,
        nextAt: null, nextNote: "", surveyAt: null, ajakAt: null, konfirmAt: null, doneAt: null, objections: [],
        owner: me.email || ""
      };
      leads.unshift(lead);
      persistLead(lead);
      showToast("Lead tersimpan · " + leadTemperature(lead));
      refreshAll();
    });
  }

  // ---------- Playbook ----------

  function renderPlaybook() {
    var el = document.getElementById("view-playbook");
    var counts = {};
    STAGES.concat(["Lost"]).forEach(function (s) { counts[s] = 0; });
    leads.forEach(function (l) { counts[l.stage] = (counts[l.stage] || 0) + 1; });

    var html = renderPageHeader("Playbook", "Pendekatan yang disarankan di tiap tahap — jadi CS tau strateginya, bukan cuma status leadnya", null);
    html += '<div class="panel usp-panel">';
    html += '<h2>' + escapeHtml(USP_KEY) + '</h2>';
    html += '<p class="hint">Keunggulan kawasan &amp; unit buat bahan jawaban ke calon pembeli — bisa diubah kalau ada info baru</p>';
    html += renderClusterFocus(USP_KEY, "");
    html += '</div>';
    html += objectionPlaybookHtml();
    STAGES.concat(["Lost"]).forEach(function (stage) {
      var s = STRATEGY[stage];
      html += '<div class="panel">';
      html += '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">';
      html += '<h2 style="margin:0">' + STAGE_LABEL[stage] + '</h2>';
      html += '<span class="badge ' + STAGE_CLASS[stage] + '">' + counts[stage] + ' lead saat ini</span>';
      html += '</div>';
      html += '<p class="hint" style="margin-top:6px">' + escapeHtml(s.goal) + '</p>';
      if (s.actions && s.actions.length) {
        html += '<ul class="strategy-actions" style="padding-left:19px;margin-bottom:' + (s.avoid || Object.keys(s.scripts).length ? "10px" : "0") + '">';
        s.actions.forEach(function (a) { html += '<li>' + escapeHtml(a) + '</li>'; });
        html += '</ul>';
      }
      if (s.scripts && Object.keys(s.scripts).length) {
        html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:' + (s.avoid ? "10px" : "0") + '">';
        Object.keys(s.scripts).forEach(function (g) {
          var scriptText = s.scripts[g].split("{{minat}}").join("(nama unit)");
          html += '<div class="strategy-script" style="margin-bottom:0"><div class="k">' + escapeHtml(g) + '</div>"' + escapeHtml(scriptText) + '"</div>';
        });
        html += '</div>';
      }
      if (s.avoid) html += '<div class="strategy-avoid">Hindari: ' + escapeHtml(s.avoid) + '</div>';
      html += '</div>';
    });

    MINAT_GROUPS.forEach(function (g) {
      html += '<div class="panel">';
      html += '<h2>Fokus Jual — ' + g.group + '</h2>';
      html += '<p class="hint">Catatan ini otomatis muncul di strategi tiap lead yang minatnya sama — isi sekali, kepakai terus</p>';
      g.options.forEach(function (m) { html += renderClusterFocus(m); });
      html += '</div>';
    });

    el.innerHTML = html;
    bindDetailHandlers(el);
  }

  // ---------- Nav ----------

  // Jump to one lead in Semua Lead with its detail open.
  function openLead(id) {
    var lead = leads.find(function (l) { return l.id === id; });
    if (!lead) return;
    filters = { source: "", stage: "", minat: "", temp: "", q: lead.telp, dateFrom: "", dateTo: "" };
    expandedId = id;
    refreshAll();
    switchView("all");
  }

  function switchView(view) {
    document.querySelectorAll("nav.tabs button").forEach(function (b) {
      var on = b.getAttribute("data-view") === view;
      b.classList.toggle("active", on);
      if (on && b.scrollIntoView) b.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    });
    document.querySelectorAll("section.view").forEach(function (s) { s.classList.remove("active"); });
    document.getElementById("view-" + view).classList.add("active");
  }

  document.querySelectorAll("nav.tabs button").forEach(function (btn) {
    btn.addEventListener("click", function () { switchView(btn.getAttribute("data-view")); });
  });

  function recentCutoff() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - RECENT_DAYS);
    return d;
  }

  // PostgREST caps each response (1000 rows by default), so read in pages.
  async function fetchAllLeads(applyFilter) {
    var PAGE = 1000, from = 0, out = [];
    for (;;) {
      var q = applyFilter(db.from("leads").select("*"))
        .order("created_at", { ascending: false })
        .order("id", { ascending: true })
        .range(from, from + PAGE - 1);
      var res = await q;
      if (res.error) throw res.error;
      out = out.concat(res.data.map(rowToLead));
      if (res.data.length < PAGE) return out;
      from += PAGE;
    }
  }

  var ACTIVE_STAGE_FILTER = 'stage.in.(Masuk,Direspon,"Follow Up",Janjian)';

  async function loadLeadsFromDb() {
    var cutoff = recentCutoff().toISOString();
    var list = await fetchAllLeads(function (q) {
      return q.or('created_at.gte."' + cutoff + '",' + ACTIVE_STAGE_FILTER);
    });
    historyLoaded = false;
    return list;
  }

  function ensureHistoryLoaded() {
    if (historyLoaded) return Promise.resolve(true);
    if (historyLoading) return historyLoading;
    var cutoff = recentCutoff().toISOString();
    historyLoading = fetchAllLeads(function (q) {
      return q.lt("created_at", cutoff).in("stage", ["Deal", "Lost"]);
    }).then(function (older) {
      var known = {};
      leads.concat(teamLeads).forEach(function (l) { known[l.id] = true; });
      placeLoaded(older.filter(function (l) { return !known[l.id]; }));
      leads.sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
      teamLeads.sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
      historyLoaded = true;
      refreshAll();
      showToast(older.length ? older.length + " lead lama dimuat" : "Tidak ada lead lama");
      return true;
    }).catch(function (e) {
      showToast("Gagal memuat riwayat (" + (e.code || e.message || "error") + ")");
      refreshAll();
      return false;
    }).then(function (ok) {
      historyLoading = null;
      return ok;
    });
    return historyLoading;
  }

  async function loadClusterNotesFromDb() {
    var res = await db.from("cluster_notes").select("minat, note");
    if (res.error) throw res.error;
    if (!res.data.length && !isAdmin()) return {};
    if (!res.data.length) {
      var seeded = {};
      var rows = Object.keys(CLUSTER_NOTES_SEED).map(function (k) {
        seeded[k] = CLUSTER_NOTES_SEED[k];
        return { minat: k, note: CLUSTER_NOTES_SEED[k] };
      });
      var ins = await db.from("cluster_notes").upsert(rows);
      if (ins.error) throw ins.error;
      return seeded;
    }
    var obj = {};
    res.data.forEach(function (r) { obj[r.minat] = r.note; });
    return obj;
  }

  function renderAll() {
    var loadingEl = document.getElementById("app-loading");
    if (loadingEl) loadingEl.classList.remove("show");
    refreshAll();
  }

  function startLocal() {
    db = null;
    historyLoaded = true;
    leads = loadStateLocal();
    clusterNotes = loadClusterNotesLocal();
    ensureObjectionNotes();
    renderAll();
  }

  function applyRole() {
    document.getElementById("nav-team").hidden = !isAdmin();
    document.getElementById("nav-all-label").textContent = isAdmin() ? "Lead Kantor" : "Lead Saya";
    var who = document.getElementById("account-email");
    who.textContent = isAdmin() ? (me.nama === "Admin" ? "Admin" : me.nama + " · Admin") : me.nama + " · Marketing";
    document.body.classList.toggle("role-marketing", !isAdmin());
  }

  async function startWithSupabase(client, session) {
    document.getElementById("login-overlay").classList.remove("show");
    document.getElementById("account").hidden = false;
    document.getElementById("logout-btn-m").hidden = false;
    document.getElementById("account-email").textContent = session.user.email || "";
    try {
      db = client;
      var mres = await client.from("team_members").select("email, nama, role");
      if (mres.error) throw mres.error;
      var mine = (mres.data || []).filter(function (m) { return m.email === (session.user.email || "").toLowerCase(); })[0];
      if (!mine) { var nm = new Error("not member"); nm.code = "42501"; throw nm; }
      me = { email: mine.email, nama: mine.nama || mine.email.split("@")[0], role: mine.role };
      teamMembers = mres.data.filter(function (m) { return m.role === "marketing"; });
      leads = []; teamLeads = [];
      placeLoaded(await loadLeadsFromDb());
      applyRole();
      clusterNotes = await loadClusterNotesFromDb();
      ensureObjectionNotes();
      renderAll();
    } catch (e) {
      db = null;
      var notMember = e && e.code === "42501";
      showToast(notMember ? "Akun belum terdaftar sebagai anggota tim" : "Gagal memuat data dari server (" + (e.code || e.message || "error") + ")");
      document.getElementById("app-loading").classList.add("error");
      document.getElementById("app-loading").textContent = notMember
        ? "Akun " + (session.user.email || "ini") + " belum terdaftar sebagai anggota tim. Minta admin menambahkan email ini ke daftar tim."
        : "Gagal memuat data. Muat ulang halaman untuk mencoba lagi.";
    }
  }

  var DEFAULT_EMAIL_DOMAIN = "shaistanayacity.com";
  function loginEmailValue(v) {
    v = v.trim().toLowerCase();
    return v.indexOf("@") === -1 ? v + "@" + DEFAULT_EMAIL_DOMAIN : v;
  }

  function showLogin(client) {
    document.getElementById("login-overlay").classList.add("show");
    var form = document.getElementById("login-form");
    var errEl = document.getElementById("login-error");
    var submit = document.getElementById("login-submit");
    form.onsubmit = async function (e) {
      e.preventDefault();
      errEl.textContent = "";
      submit.disabled = true;
      var res = await client.auth.signInWithPassword({
        email: loginEmailValue(document.getElementById("login-email").value),
        password: document.getElementById("login-password").value
      });
      submit.disabled = false;
      if (res.error) { errEl.textContent = "Email atau password salah."; return; }
      startWithSupabase(client, res.data.session);
    };
  }

  // ---------- Theme ----------

  var THEME_KEY = "shaistanaya_theme";
  var THEME_ORDER = ["auto", "light", "dark"];
  var THEME_META = {
    auto: { label: "Tema: otomatis (ikut perangkat)", short: "Tema otomatis", icon: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor"/></svg>' },
    light: { label: "Tema: terang", short: "Tema terang", icon: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>' },
    dark: { label: "Tema: gelap", short: "Tema gelap", icon: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1z"/></svg>' }
  };
  function currentTheme() {
    var t = document.documentElement.getAttribute("data-theme");
    return t === "light" || t === "dark" ? t : "auto";
  }
  function renderThemeButton() {
    var meta = THEME_META[currentTheme()];
    document.querySelectorAll(".theme-toggle").forEach(function (btn) {
      btn.innerHTML = meta.icon + (btn.classList.contains("theme-row") ? "<span>" + meta.short + " · ganti</span>" : "");
      btn.title = meta.label + " — klik untuk ganti";
      btn.setAttribute("aria-label", meta.label + ", klik untuk ganti");
    });
  }
  function cycleTheme() {
    var next = THEME_ORDER[(THEME_ORDER.indexOf(currentTheme()) + 1) % THEME_ORDER.length];
    if (next === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", next);
    try {
      if (next === "auto") localStorage.removeItem(THEME_KEY);
      else localStorage.setItem(THEME_KEY, next);
    } catch (e) { /* storage unavailable: theme still applies this session */ }
    renderThemeButton();
    showToast(THEME_META[next].label);
  }
  document.querySelectorAll(".theme-toggle").forEach(function (btn) { btn.addEventListener("click", cycleTheme); });
  renderThemeButton();

  async function init() {
    var cfg = window.SHAISTANAYA_CONFIG || {};
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase) {
      startLocal();
      return;
    }
    var client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    var logout = async function () {
      await client.auth.signOut();
      location.reload();
    };
    document.getElementById("logout-btn").addEventListener("click", logout);
    document.getElementById("logout-btn-m").addEventListener("click", logout);
    var sessionRes = await client.auth.getSession();
    var session = sessionRes.data && sessionRes.data.session;
    if (session) startWithSupabase(client, session);
    else showLogin(client);
  }

  init();
})();
</script>
